<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>TJK NETWORK</title>

    <style>
        /* =========================================================
           PAGE
           ========================================================= */

        html,
        body {
            margin: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            background: #000;
        }


        /* =========================================================
           WEBSITE FRAME
           ========================================================= */

        #websiteFrame {
            position: absolute;

            top: 0;
            left: 0;

            margin: 0;
            padding: 0;

            border: 0;

            display: block;

            transform-origin: top left;
        }
    </style>
</head>

<body>

    <iframe
        id="websiteFrame"
        title="TJK NETWORK"
        allow="autoplay; fullscreen"
        allowfullscreen>
    </iframe>


    <script>
        (() => {
            /* =====================================================
               CONFIGURATION
               ===================================================== */

            // Current paid TJK NETWORK website.
            const WEBSITE_ORIGIN =
                "https://www.tjk152.com";

            // GitHub Pages project base.
            const GITHUB_PROJECT_BASE =
                "/tjk-network";

            // Wix portrait-mobile editor canvas width.
            const WIX_PORTRAIT_WIDTH =
                320;

            /*
             * Landscape uses a wider internal browser viewport.
             *
             * This is intentionally different from the previous
             * landscape patch. We do NOT keep Wix trapped inside
             * its 320px portrait canvas when the phone is sideways.
             */
            const WIX_LANDSCAPE_WIDTH =
                980;

            // Maximum short-side size treated as a phone.
            const PHONE_SHORT_SIDE_MAX =
                768;


            /* =====================================================
               ELEMENTS
               ===================================================== */

            const websiteFrame =
                document.getElementById("websiteFrame");


            /* =====================================================
               PAGE ROUTING
               ===================================================== */

            function getWebsitePath() {
                let path =
                    window.location.pathname || "/";


                if (
                    path === GITHUB_PROJECT_BASE ||
                    path === GITHUB_PROJECT_BASE + "/"
                ) {
                    return "/";
                }


                if (
                    path.startsWith(
                        GITHUB_PROJECT_BASE + "/"
                    )
                ) {
                    path =
                        path.slice(
                            GITHUB_PROJECT_BASE.length
                        );
                }


                if (!path.startsWith("/")) {
                    path =
                        "/" + path;
                }


                return path;
            }


            /* =====================================================
               DEVICE / ORIENTATION DETECTION
               ===================================================== */

            function isPhoneViewport() {
                return (
                    Math.min(
                        window.innerWidth,
                        window.innerHeight
                    ) <= PHONE_SHORT_SIDE_MAX
                );
            }


            function isLandscapePhone() {
                return (
                    isPhoneViewport() &&
                    window.innerWidth >
                    window.innerHeight
                );
            }


            function isPortraitPhone() {
                return (
                    isPhoneViewport() &&
                    window.innerHeight >=
                    window.innerWidth
                );
            }


            /* =====================================================
               FRAME HELPERS
               ===================================================== */

            function resetFrame() {
                websiteFrame.style.top =
                    "0";

                websiteFrame.style.left =
                    "0";

                websiteFrame.style.transformOrigin =
                    "top left";
            }


            /* =====================================================
               PORTRAIT PHONE
               ===================================================== */

            function applyPortraitPhoneFrame() {
                const viewportWidth =
                    window.innerWidth;

                const viewportHeight =
                    window.innerHeight;

                const scale =
                    viewportWidth /
                    WIX_PORTRAIT_WIDTH;


                resetFrame();


                /*
                 * Preserve the working portrait patch:
                 *
                 * Wix renders at its native 320px mobile width,
                 * then the complete page is scaled to the actual
                 * phone width.
                 */

                websiteFrame.style.width =
                    WIX_PORTRAIT_WIDTH + "px";

                websiteFrame.style.height =
                    (
                        viewportHeight /
                        scale
                    ) + "px";

                websiteFrame.style.transform =
                    `scale(${scale})`;
            }


            /* =====================================================
               LANDSCAPE PHONE
               ===================================================== */

            function applyLandscapePhoneFrame() {
                const viewportWidth =
                    window.innerWidth;

                const viewportHeight =
                    window.innerHeight;

                /*
                 * Give Wix a genuinely wide internal viewport so
                 * it can render a landscape/desktop-style layout
                 * instead of the centered 320px portrait layout.
                 *
                 * Then scale that complete 980px viewport to the
                 * phone's actual landscape width.
                 */

                const scale =
                    viewportWidth /
                    WIX_LANDSCAPE_WIDTH;


                resetFrame();


                websiteFrame.style.width =
                    WIX_LANDSCAPE_WIDTH + "px";

                websiteFrame.style.height =
                    (
                        viewportHeight /
                        scale
                    ) + "px";

                websiteFrame.style.transform =
                    `scale(${scale})`;
            }


            /* =====================================================
               TABLET / DESKTOP
               ===================================================== */

            function applyStandardFrame() {
                resetFrame();


                websiteFrame.style.width =
                    "100%";

                websiteFrame.style.height =
                    "100%";

                websiteFrame.style.transform =
                    "none";
            }


            /* =====================================================
               RESPONSIVE FRAME CONTROLLER
               ===================================================== */

            function applyResponsiveFrame() {
                if (isLandscapePhone()) {
                    applyLandscapePhoneFrame();
                    return;
                }


                if (isPortraitPhone()) {
                    applyPortraitPhoneFrame();
                    return;
                }


                applyStandardFrame();
            }


            /* =====================================================
               RESPONSIVE UPDATE SCHEDULER
               ===================================================== */

            function scheduleResponsiveUpdate() {
                requestAnimationFrame(() => {
                    requestAnimationFrame(
                        applyResponsiveFrame
                    );
                });
            }


            /* =====================================================
               WEBSITE LOADING
               ===================================================== */

            function loadWebsite() {
                const websitePath =
                    getWebsitePath();

                const queryString =
                    window.location.search || "";


                websiteFrame.src =
                    WEBSITE_ORIGIN +
                    websitePath +
                    queryString;
            }


            /* =====================================================
               INITIALIZATION
               ===================================================== */

            applyResponsiveFrame();

            loadWebsite();


            /* =====================================================
               VIEWPORT EVENTS
               ===================================================== */

            window.addEventListener(
                "resize",
                scheduleResponsiveUpdate
            );


            window.addEventListener(
                "orientationchange",
                () => {
                    /*
                     * iOS Safari can expose several intermediate
                     * viewport sizes while rotating.
                     *
                     * Re-apply after the viewport settles.
                     */

                    scheduleResponsiveUpdate();

                    setTimeout(
                        applyResponsiveFrame,
                        100
                    );

                    setTimeout(
                        applyResponsiveFrame,
                        250
                    );

                    setTimeout(
                        applyResponsiveFrame,
                        500
                    );
                }
            );
        })();
    </script>

</body>
</html>

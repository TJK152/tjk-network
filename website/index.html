<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <!-- Allow the wrapper to use the full mobile viewport, including safe-area devices. -->
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>TJK NETWORK</title>

    <style>
        /* =========================================================
           PAGE / WRAPPER
           ========================================================= */

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        /* =========================================================
           WIX WEBSITE FRAME
           ========================================================= */

        #websiteFrame {
            position: absolute;
            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            margin: 0;
            padding: 0;
            border: 0;

            display: block;

            /*
              Mobile scaling is applied with transform, so keep the
              transform anchored to the upper-left corner.
            */
            transform-origin: top left;
        }
    </style>
</head>

<body>

    <iframe
        id="websiteFrame"
        title="TJK NETWORK"
        allow="autoplay; fullscreen"
        allowfullscreen>
    </iframe>

    <script>
        (() => {
            /* =====================================================
               CONFIGURATION
               ===================================================== */

            // Current paid Wix/custom-domain site used for testing.
            const WIX_ORIGIN = "https://www.tjk152.com";

            // Current GitHub Pages test location.
            const GITHUB_BASE = "/tjk-network/website";

            /*
              Wix's mobile editor canvas is 320px wide.

              On mobile, Wix is allowed to render at that native
              320px width. The finished iframe is then scaled to the
              actual browser width so the page fills the phone screen.
            */
            const WIX_MOBILE_WIDTH = 320;
            const MOBILE_BREAKPOINT = 768;

            const frame = document.getElementById("websiteFrame");


            /* =====================================================
               ROUTING
               ===================================================== */

            function getWixPath() {
                let path = window.location.pathname || "/";

                /*
                  GitHub test examples:

                  /tjk-network/website/
                      -> /

                  /tjk-network/website/shop
                      -> /shop

                  /tjk-network/website/schedule
                      -> /schedule
                */
                if (
                    path === GITHUB_BASE ||
                    path === GITHUB_BASE + "/"
                ) {
                    path = "/";
                } else if (
                    path.startsWith(GITHUB_BASE + "/")
                ) {
                    path = path.slice(GITHUB_BASE.length);
                } else {
                    path = "/";
                }

                if (!path.startsWith("/")) {
                    path = "/" + path;
                }

                return path;
            }


            /* =====================================================
               RESPONSIVE FRAME / MOBILE PAGE PATCH
               ===================================================== */

            function applyResponsiveFrame() {
                const viewportWidth = window.innerWidth;
                const viewportHeight = window.innerHeight;

                if (viewportWidth <= MOBILE_BREAKPOINT) {
                    /*
                      MOBILE

                      Keep Wix's internal viewport at exactly 320px.
                      Then scale that completed mobile page so its
                      width exactly matches the phone viewport.
                    */
                    const scale =
                        viewportWidth / WIX_MOBILE_WIDTH;

                    frame.style.top = "0";
                    frame.style.left = "0";

                    frame.style.width =
                        WIX_MOBILE_WIDTH + "px";

                    /*
                      Compensate for the transform vertically so the
                      scaled iframe still covers the entire browser.
                    */
                    frame.style.height =
                        (viewportHeight / scale) + "px";

                    frame.style.transformOrigin = "top left";
                    frame.style.transform =
                        `scale(${scale})`;

                    return;
                }

                /*
                  DESKTOP / TABLET

                  Normal full-window iframe. No scaling.
                */
                frame.style.top = "0";
                frame.style.left = "0";

                frame.style.width = "100%";
                frame.style.height = "100%";

                frame.style.transform = "none";
            }


            /* =====================================================
               INITIALIZATION
               ===================================================== */

            function loadWebsite() {
                const path = getWixPath();
                const query = window.location.search || "";

                frame.src =
                    WIX_ORIGIN +
                    path +
                    query;
            }

            applyResponsiveFrame();
            loadWebsite();


            /* =====================================================
               VIEWPORT CHANGES
               ===================================================== */

            window.addEventListener(
                "resize",
                applyResponsiveFrame
            );

            window.addEventListener(
                "orientationchange",
                () => {
                    /*
                      Give mobile Safari two layout frames to settle
                      before recalculating the viewport dimensions.
                    */
                    requestAnimationFrame(() => {
                        requestAnimationFrame(
                            applyResponsiveFrame
                        );
                    });
                }
            );
        })();
    </script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>TJK NETWORK</title>

    <style>
        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        #websiteFrame {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            border: 0;
            display: block;
            transform-origin: top left;
        }
    </style>
</head>

<body>
    <iframe
        id="websiteFrame"
        title="TJK NETWORK"
        allow="autoplay; fullscreen"
        allowfullscreen>
    </iframe>

    <script>
        (() => {
            /* =====================================================
               CONFIGURATION
               ===================================================== */

            // Current paid site used during testing.
            const WIX_ORIGIN = "https://www.tjk152.com";

            // Wix mobile editor canvas width.
            const WIX_MOBILE_WIDTH = 320;
            const MOBILE_BREAKPOINT = 768;

            const frame = document.getElementById("websiteFrame");


            /* =====================================================
               MOBILE PAGE PATCH
               ===================================================== */

            function applyResponsiveFrame() {
                const viewportWidth = window.innerWidth;
                const viewportHeight = window.innerHeight;

                if (viewportWidth <= MOBILE_BREAKPOINT) {
                    const scale = viewportWidth / WIX_MOBILE_WIDTH;

                    frame.style.top = "0";
                    frame.style.left = "0";
                    frame.style.width = WIX_MOBILE_WIDTH + "px";
                    frame.style.height = (viewportHeight / scale) + "px";
                    frame.style.transformOrigin = "top left";
                    frame.style.transform = `scale(${scale})`;
                    return;
                }

                frame.style.top = "0";
                frame.style.left = "0";
                frame.style.width = "100%";
                frame.style.height = "100%";
                frame.style.transform = "none";
            }


            /* =====================================================
               LOAD HOMEPAGE
               ===================================================== */

            frame.src = WIX_ORIGIN + "/";

            applyResponsiveFrame();

            window.addEventListener("resize", applyResponsiveFrame);

            window.addEventListener("orientationchange", () => {
                requestAnimationFrame(() => {
                    requestAnimationFrame(applyResponsiveFrame);
                });
            });
        })();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>TJK NETWORK</title>

    <style>
        /* =========================================================
           PAGE
           ========================================================= */

        html,
        body {
            margin: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            background: #000;
        }


        /* =========================================================
           WEBSITE FRAME
           ========================================================= */

        #websiteFrame {
            position: absolute;

            top: 0;
            left: 0;

            margin: 0;
            padding: 0;

            border: 0;

            display: block;

            transform-origin: top left;
        }
    </style>
</head>

<body>

    <iframe
        id="websiteFrame"
        title="TJK NETWORK"
        allow="autoplay; fullscreen"
        allowfullscreen>
    </iframe>


    <script>
        (() => {
            /* =====================================================
               CONFIGURATION
               ===================================================== */

            // Current paid TJK NETWORK website.
            const WEBSITE_ORIGIN =
                "https://www.tjk152.com";

            // GitHub Pages project base.
            const GITHUB_PROJECT_BASE =
                "/tjk-network";

            /*
             * Wix mobile page width.
             *
             * IMPORTANT:
             * We intentionally keep Wix rendering at 320px in BOTH
             * portrait and landscape.
             *
             * The complete 320px page is then uniformly zoomed until
             * its width exactly matches the browser viewport width.
             */
            const WIX_MOBILE_WIDTH =
                320;

            /*
             * Treat the device as a phone whenever its SHORT side is
             * no larger than this value.
             *
             * This keeps landscape phones in mobile zoom mode even
             * when their long side is wider than 768px.
             */
            const PHONE_SHORT_SIDE_MAX =
                768;


            /* =====================================================
               ELEMENTS
               ===================================================== */

            const websiteFrame =
                document.getElementById("websiteFrame");


            /* =====================================================
               PAGE ROUTING
               ===================================================== */

            function getWebsitePath() {
                let path =
                    window.location.pathname || "/";


                /*
                 * Repository homepage:
                 *
                 * /tjk-network
                 * /tjk-network/
                 *
                 * becomes:
                 *
                 * /
                 */

                if (
                    path === GITHUB_PROJECT_BASE ||
                    path === GITHUB_PROJECT_BASE + "/"
                ) {
                    return "/";
                }


                /*
                 * Generic routing:
                 *
                 * /tjk-network/shop
                 *      -> /shop
                 *
                 * /tjk-network/about
                 *      -> /about
                 *
                 * /tjk-network/anything/else
                 *      -> /anything/else
                 */

                if (
                    path.startsWith(
                        GITHUB_PROJECT_BASE + "/"
                    )
                ) {
                    path =
                        path.slice(
                            GITHUB_PROJECT_BASE.length
                        );
                }


                if (!path.startsWith("/")) {
                    path =
                        "/" + path;
                }


                return path;
            }


            /* =====================================================
               DEVICE DETECTION
               ===================================================== */

            function isPhoneViewport() {
                const shortSide =
                    Math.min(
                        window.innerWidth,
                        window.innerHeight
                    );


                return (
                    shortSide <=
                    PHONE_SHORT_SIDE_MAX
                );
            }


            /* =====================================================
               PHONE SCALE / ZOOM PATCH
               ===================================================== */

            function applyPhoneFrame() {
                const viewportWidth =
                    window.innerWidth;

                const viewportHeight =
                    window.innerHeight;


                /*
                 * SCALE TO FIT WIDTH
                 *
                 * Example:
                 *
                 * portrait:
                 * 390 / 320 = 1.21875x
                 *
                 * landscape:
                 * 844 / 320 = 2.6375x
                 *
                 * This deliberately zooms/enlarges the exact same
                 * Wix mobile page until it fills whatever width the
                 * phone currently has.
                 */

                const scale =
                    viewportWidth /
                    WIX_MOBILE_WIDTH;


                websiteFrame.style.top =
                    "0";

                websiteFrame.style.left =
                    "0";


                /*
                 * Wix always sees a 320px-wide mobile viewport.
                 */

                websiteFrame.style.width =
                    WIX_MOBILE_WIDTH + "px";


                /*
                 * Compensate for the scale vertically.
                 *
                 * After the transform, the iframe still covers the
                 * complete visible browser height.
                 */

                websiteFrame.style.height =
                    (
                        viewportHeight /
                        scale
                    ) + "px";


                websiteFrame.style.transformOrigin =
                    "top left";


                websiteFrame.style.transform =
                    `scale(${scale})`;
            }


            /* =====================================================
               TABLET / DESKTOP
               ===================================================== */

            function applyStandardFrame() {
                websiteFrame.style.top =
                    "0";

                websiteFrame.style.left =
                    "0";

                websiteFrame.style.width =
                    "100%";

                websiteFrame.style.height =
                    "100%";

                websiteFrame.style.transformOrigin =
                    "top left";

                websiteFrame.style.transform =
                    "none";
            }


            /* =====================================================
               RESPONSIVE FRAME CONTROLLER
               ===================================================== */

            function applyResponsiveFrame() {
                /*
                 * Phones use ONE rule regardless of orientation:
                 *
                 * 320px Wix mobile page
                 *          ↓
                 * scale to browser width
                 *
                 * Rotating the phone simply changes the browser
                 * width, which automatically changes the scale.
                 */

                if (isPhoneViewport()) {
                    applyPhoneFrame();
                    return;
                }


                applyStandardFrame();
            }


            /* =====================================================
               RESPONSIVE UPDATE SCHEDULER
               ===================================================== */

            function scheduleResponsiveUpdate() {
                requestAnimationFrame(() => {
                    requestAnimationFrame(
                        applyResponsiveFrame
                    );
                });
            }


            /* =====================================================
               WEBSITE LOADING
               ===================================================== */

            function loadWebsite() {
                const websitePath =
                    getWebsitePath();

                const queryString =
                    window.location.search || "";


                websiteFrame.src =
                    WEBSITE_ORIGIN +
                    websitePath +
                    queryString;
            }


            /* =====================================================
               INITIALIZATION
               ===================================================== */

            applyResponsiveFrame();

            loadWebsite();


            /* =====================================================
               VIEWPORT EVENTS
               ===================================================== */

            window.addEventListener(
                "resize",
                scheduleResponsiveUpdate
            );


            window.addEventListener(
                "orientationchange",
                () => {
                    /*
                     * iOS Safari reports several intermediate viewport
                     * sizes during rotation.
                     *
                     * Recalculate repeatedly until the final landscape
                     * or portrait width has settled.
                     */

                    scheduleResponsiveUpdate();


                    setTimeout(
                        applyResponsiveFrame,
                        100
                    );


                    setTimeout(
                        applyResponsiveFrame,
                        250
                    );


                    setTimeout(
                        applyResponsiveFrame,
                        500
                    );
                }
            );
        })();
    </script>

</body>
</html>

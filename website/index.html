<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>TJK NETWORK</title>

    <style>
        /* =========================================================
           PAGE
           ========================================================= */

        html,
        body {
            margin: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            background: #000;
        }


        /* =========================================================
           WEBSITE FRAME
           ========================================================= */

        #websiteFrame {
            position: absolute;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            margin: 0;
            padding: 0;

            border: 0;

            display: block;

            transform-origin: top left;
        }
    </style>
</head>

<body>

    <iframe
        id="websiteFrame"
        title="TJK NETWORK"
        allow="autoplay; fullscreen"
        allowfullscreen>
    </iframe>


    <script>
        (() => {
            /* =====================================================
               CONFIGURATION
               ===================================================== */

            // Current paid TJK NETWORK website.
            const WEBSITE_ORIGIN =
                "https://www.tjk152.com";

            // GitHub Pages project base.
            const GITHUB_PROJECT_BASE =
                "/tjk-network";

            // Wix mobile editor canvas width.
            const WIX_MOBILE_WIDTH =
                320;

            // Portrait mobile breakpoint.
            const MOBILE_BREAKPOINT =
                768;


            /* =====================================================
               ELEMENTS
               ===================================================== */

            const websiteFrame =
                document.getElementById("websiteFrame");


            /* =====================================================
               PAGE ROUTING
               ===================================================== */

            function getWebsitePath() {
                let path =
                    window.location.pathname || "/";


                /*
                 * Repository homepage:
                 *
                 * /tjk-network
                 * /tjk-network/
                 *
                 * becomes:
                 *
                 * /
                 */

                if (
                    path === GITHUB_PROJECT_BASE ||
                    path === GITHUB_PROJECT_BASE + "/"
                ) {
                    return "/";
                }


                /*
                 * Generic page routing.
                 *
                 * /tjk-network/shop
                 *      -> /shop
                 *
                 * /tjk-network/about
                 *      -> /about
                 *
                 * /tjk-network/anything/else
                 *      -> /anything/else
                 */

                if (
                    path.startsWith(
                        GITHUB_PROJECT_BASE + "/"
                    )
                ) {
                    path =
                        path.slice(
                            GITHUB_PROJECT_BASE.length
                        );
                }


                if (!path.startsWith("/")) {
                    path =
                        "/" + path;
                }


                return path;
            }


            /* =====================================================
               ORIENTATION DETECTION
               ===================================================== */

            function isLandscapePhone() {
                /*
                 * Do not use only "width <= 768".
                 *
                 * A modern phone in landscape can be wider than
                 * 768 CSS pixels, which caused the previous patch
                 * to fall into the desktop behavior.
                 *
                 * The short viewport height is the useful signal
                 * here: landscape phones are wide but shallow.
                 */

                return (
                    window.innerWidth >
                    window.innerHeight
                ) && (
                    window.innerHeight <=
                    MOBILE_BREAKPOINT
                );
            }


            function isPortraitPhone() {
                return (
                    window.innerHeight >=
                    window.innerWidth
                ) && (
                    window.innerWidth <=
                    MOBILE_BREAKPOINT
                );
            }


            /* =====================================================
               FRAME MODES
               ===================================================== */

            function applyPortraitMobileFrame() {
                const viewportWidth =
                    window.innerWidth;

                const viewportHeight =
                    window.innerHeight;

                /*
                 * Wix's portrait mobile canvas is 320px wide.
                 *
                 * Keep Wix rendering internally at 320px and scale
                 * that completed layout to the phone's full width.
                 */

                const scale =
                    viewportWidth /
                    WIX_MOBILE_WIDTH;


                websiteFrame.style.top =
                    "0";

                websiteFrame.style.left =
                    "0";

                websiteFrame.style.width =
                    WIX_MOBILE_WIDTH + "px";

                websiteFrame.style.height =
                    (
                        viewportHeight /
                        scale
                    ) + "px";

                websiteFrame.style.transformOrigin =
                    "top left";

                websiteFrame.style.transform =
                    `scale(${scale})`;
            }


            function applyLandscapeMobileFrame() {
                /*
                 * LANDSCAPE PHONE
                 *
                 * The previous version removed the 320px transform
                 * and gave Wix the full landscape iframe width.
                 *
                 * Wix continued serving its centered mobile canvas,
                 * which left large black side areas.
                 *
                 * Instead, keep Wix's 320px mobile viewport but scale
                 * it according to the LANDSCAPE VIEWPORT HEIGHT.
                 *
                 * This prevents the page from being blown up to the
                 * entire long edge of the phone while still making
                 * the mobile page fill the available height.
                 *
                 * The scaled page is horizontally centered.
                 */

                const viewportWidth =
                    window.innerWidth;

                const viewportHeight =
                    window.innerHeight;


                /*
                 * Use the portrait canvas as the stable Wix viewport.
                 *
                 * A landscape phone's usable height is the limiting
                 * dimension, so derive a conservative scale from it.
                 *
                 * 568px is used as the reference visible height for
                 * the 320px Wix mobile canvas. This keeps the page
                 * readable without the oversized portrait-style zoom.
                 */

                const WIX_MOBILE_REFERENCE_HEIGHT =
                    568;

                const scale =
                    viewportHeight /
                    WIX_MOBILE_REFERENCE_HEIGHT;

                const scaledWidth =
                    WIX_MOBILE_WIDTH *
                    scale;

                const left =
                    Math.max(
                        0,
                        (
                            viewportWidth -
                            scaledWidth
                        ) / 2
                    );


                websiteFrame.style.top =
                    "0";

                websiteFrame.style.left =
                    left + "px";

                websiteFrame.style.width =
                    WIX_MOBILE_WIDTH + "px";

                websiteFrame.style.height =
                    WIX_MOBILE_REFERENCE_HEIGHT + "px";

                websiteFrame.style.transformOrigin =
                    "top left";

                websiteFrame.style.transform =
                    `scale(${scale})`;
            }


            function applyStandardFrame() {
                /*
                 * TABLET / DESKTOP
                 */

                websiteFrame.style.top =
                    "0";

                websiteFrame.style.left =
                    "0";

                websiteFrame.style.width =
                    "100%";

                websiteFrame.style.height =
                    "100%";

                websiteFrame.style.transform =
                    "none";
            }


            /* =====================================================
               RESPONSIVE FRAME CONTROLLER
               ===================================================== */

            function applyResponsiveFrame() {
                if (isLandscapePhone()) {
                    applyLandscapeMobileFrame();
                    return;
                }


                if (isPortraitPhone()) {
                    applyPortraitMobileFrame();
                    return;
                }


                applyStandardFrame();
            }


            /* =====================================================
               RESPONSIVE UPDATE SCHEDULER
               ===================================================== */

            function scheduleResponsiveUpdate() {
                requestAnimationFrame(() => {
                    requestAnimationFrame(
                        applyResponsiveFrame
                    );
                });
            }


            /* =====================================================
               WEBSITE LOADING
               ===================================================== */

            function loadWebsite() {
                const websitePath =
                    getWebsitePath();

                const queryString =
                    window.location.search || "";


                websiteFrame.src =
                    WEBSITE_ORIGIN +
                    websitePath +
                    queryString;
            }


            /* =====================================================
               INITIALIZATION
               ===================================================== */

            applyResponsiveFrame();

            loadWebsite();


            /* =====================================================
               VIEWPORT EVENTS
               ===================================================== */

            window.addEventListener(
                "resize",
                scheduleResponsiveUpdate
            );


            window.addEventListener(
                "orientationchange",
                () => {
                    /*
                     * Safari can report intermediate viewport sizes
                     * during rotation.
                     *
                     * Re-check immediately and again after Safari has
                     * had time to settle on its final dimensions.
                     */

                    scheduleResponsiveUpdate();

                    setTimeout(
                        applyResponsiveFrame,
                        100
                    );

                    setTimeout(
                        applyResponsiveFrame,
                        250
                    );

                    setTimeout(
                        applyResponsiveFrame,
                        500
                    );
                }
            );
        })();
    </script>

</body>
</html>

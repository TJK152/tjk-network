<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>YOUTUBE PLAYER</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:Arial,sans-serif}
#stage{position:fixed;left:0;right:0;top:0;bottom:77px;background:#000;overflow:hidden}
#youtubeBridge{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000;pointer-events:none}
#endedScreen{
  position:absolute;inset:0;z-index:10;
  display:none;align-items:center;justify-content:center;
  background:#000;color:#fff;text-align:center;
  font:700 34px Arial,sans-serif;
  pointer-events:none;
}
#endedScreen.visible{display:flex}
#gate{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.88);padding:20px}
#gate.visible{display:flex}
#card{width:min(560px,100%);box-sizing:border-box;padding:22px;border:5px solid #007DFF;border-radius:15px;background:#004CBF}
h1{margin:0 0 8px;font-size:24px}p{line-height:1.4}
input,button{width:100%;box-sizing:border-box;font:inherit;font-weight:bold;border:5px solid #007DFF;border-radius:9px}
input{height:50px;padding:9px 11px;background:#fff;color:#0326FF}
button{margin-top:10px;min-height:50px;background:#fff;color:#0326FF;cursor:pointer}
button:hover{background:#0093FF;color:#fff}
#status{min-height:20px;margin-top:10px;font-weight:bold;white-space:pre-wrap}
#toolbar{
  position:fixed;left:0;right:0;bottom:0;height:77px;z-index:30;
  display:flex;align-items:center;justify-content:center;gap:12px;
  box-sizing:border-box;padding:10px 16px;
  background:#004CBF;border-top:5px solid #007DFF;
}
#toolbar button{
  width:auto;margin:0;padding:7px 13px;height:52px;min-height:52px;
  border:4px solid #007DFF;border-radius:10px;background:#fff;color:#0326FF;
  font-weight:bold;
}
#changeBtn{min-width:112px}
#fullscreenBtn{
  width:52px;min-width:52px;height:52px;min-height:52px;padding:0;
  display:flex;align-items:center;justify-content:center;flex:0 0 52px;
  font-size:23px;
}
#toolbar button:not(:disabled):hover{background:#0093FF;color:#fff}
#toolbar button:disabled{
  opacity:.45;
  cursor:default!important;
  pointer-events:none!important;
}
.hidden{display:none!important}

/* While browser fullscreen is active, only the video surface remains.
   The control bar is deliberately excluded from the captured 16:9 frame. */
:fullscreen #toolbar,
:-webkit-full-screen #toolbar{display:none!important}
:fullscreen #stage,
:-webkit-full-screen #stage{left:0!important;right:0!important;top:0!important;bottom:0!important}
</style>
</head>
<body>
<div id="stage">
  <iframe id="youtubeBridge" allow="autoplay; fullscreen; encrypted-media; picture-in-picture" referrerpolicy="strict-origin-when-cross-origin"></iframe>
  <div id="endedScreen"></div>
</div>
<div id="toolbar" class="hidden">
  <button id="changeBtn" type="button">DEVICE ID</button>
  <button id="fullscreenBtn" type="button" title="Full Screen">⛶</button>
</div>
<div id="gate">
  <div id="card">
    <h1>TJK NETWORK YOUTUBE PLAYER</h1>
    <p>Enter the broadcast Device ID. YouTube playback is controlled by TJK NETWORK Video Controls and captured directly by OBS.</p>
    <input id="deviceInput" autocomplete="off" spellcheck="false" placeholder="DEVICE ID">
    <button id="connectBtn">CONNECT</button>
        <div id="status">Waiting for Device ID.</div>
  </div>
</div>
<script>
"use strict";
const FIREBASE_PRIMARY="https://tjk-network-controls-default-rtdb.firebaseio.com";
const FIREBASE_BACKUP="https://tjk-network-controls-backup-default-rtdb.firebaseio.com";
let FIREBASE_BASE=FIREBASE_PRIMARY;
let tjkFirebaseSelectionPromise=null;
let tjkFirebaseStreamHealthy=false;
let tjkFirebaseFallbackTimer=null;
const TJK_FIREBASE_FALLBACK_POLL_MS=500;

function tjkFirebaseTranslateUrl(url,base){
  const s=String(url||"");
  if(s.startsWith(FIREBASE_PRIMARY))return base+s.slice(FIREBASE_PRIMARY.length);
  if(s.startsWith(FIREBASE_BACKUP))return base+s.slice(FIREBASE_BACKUP.length);
  return s;
}
async function tjkFirebaseFetch(url,options={}){
  const activeUrl=tjkFirebaseTranslateUrl(url,FIREBASE_BASE);
  try{
    const r=await fetch(activeUrl,{...options,cache:"no-store"});
    if(!r.ok){
      const body=await r.text().catch(()=>"");
      const e=new Error(`Firebase ${options.method||"GET"} ${r.status}${body?" — "+body.slice(0,180):""}`);
      e.status=r.status;
      throw e;
    }
    return r;
  }catch(primaryError){
    if(FIREBASE_BASE!==FIREBASE_PRIMARY)throw primaryError;
    const backupUrl=tjkFirebaseTranslateUrl(url,FIREBASE_BACKUP);
    const r=await fetch(backupUrl,{...options,cache:"no-store"});
    if(!r.ok){
      const body=await r.text().catch(()=>"");
      const e=new Error(`Backup Firebase ${options.method||"GET"} ${r.status}${body?" — "+body.slice(0,180):""}`);
      e.status=r.status;
      throw e;
    }
    FIREBASE_BASE=FIREBASE_BACKUP;
    tjkFirebaseStreamHealthy=false;
    setTimeout(()=>{
      try{
        if(typeof openFirebaseStream==="function")openFirebaseStream();
        else if(typeof openStream==="function")openStream();
      }catch(_){}
    },0);
    return r;
  }
}
async function tjkFirebaseProbe(base){
  const r=await fetch(base+"/.json?shallow=true",{method:"GET",cache:"no-store"});
  if(!r.ok)throw new Error(`Firebase probe ${r.status}`);
  return true;
}
async function tjkSelectFirebaseServer(){
  if(FIREBASE_BASE===FIREBASE_BACKUP)return FIREBASE_BASE;
  if(tjkFirebaseSelectionPromise)return tjkFirebaseSelectionPromise;
  tjkFirebaseSelectionPromise=(async()=>{
    try{
      await tjkFirebaseProbe(FIREBASE_PRIMARY);
      FIREBASE_BASE=FIREBASE_PRIMARY;
    }catch(_){
      await tjkFirebaseProbe(FIREBASE_BACKUP);
      FIREBASE_BASE=FIREBASE_BACKUP;
    }
    return FIREBASE_BASE;
  })();
  try{return await tjkFirebaseSelectionPromise}
  finally{tjkFirebaseSelectionPromise=null}
}
async function fbGet(url){
  const r=await tjkFirebaseFetch(url,{method:"GET"});
  return r.json().catch(()=>null);
}
const DEVICE_KEY="tjk-youtube-sender-device-id-v1";
const DEVICE_TAB_SESSION_KEY="tjk-youtube-sender-device-tab-session-v1";

const gate=document.getElementById("gate"),deviceInput=document.getElementById("deviceInput");
const connectBtn=document.getElementById("connectBtn");
const fullscreenBtn=document.getElementById("fullscreenBtn"),changeBtn=document.getElementById("changeBtn");
const toolbar=document.getElementById("toolbar"),statusEl=document.getElementById("status");
const endedScreen=document.getElementById("endedScreen");

let deviceId="",firebaseStream=null,firebaseView={},state=null;
// Publish the companion bridge file at this URL before testing.
const YOUTUBE_BRIDGE_URL="https://tjk152.github.io/tjk-network/youtube-bridge.html";
const youtubeBridge=document.getElementById("youtubeBridge");
let bridgeReady=false,lastSourceKey="",lastCommandId="";
let bridgeInfo={isLive:null,dvrAvailable:null,delaySupported:null,duration:0,time:0,seekableStart:null,seekableEnd:null};
let youtubePlaybackConfirmed=false;
let pendingEndedState=false;
let endedScreenLatched=false;
let senderPresenceTimer=null;
const FIREBASE_RUNTIME_MIN_INTERVAL_MS=2000;
let lastRuntimePublishAt=0;
let lastRuntimeSemanticKey="";
let pendingRuntimeInfo=null;
let runtimePublishTimer=null;

function cleanDeviceId(v){return String(v||"").trim().replace(/[.#$\[\]\/]/g,"_")}
function base(s){return `${FIREBASE_BASE}/devices/${encodeURIComponent(deviceId)}/videoUnified/${s}.json`}
function senderPresencePath(){return base("youtubeSenderPresence")}
function runtimePath(){return base("runtime")}
function streamPath(){return base("").replace(/\/\.json$/, ".json")}
async function publishSenderPresence(online=true){
  if(!deviceId)return;
  try{await fbPut(senderPresencePath(),{online:!!online,deviceId,lastSeen:Date.now(),page:"youtube-player"})}catch(_){}
}
function startSenderPresence(){
  if(senderPresenceTimer)clearInterval(senderPresenceTimer);
  publishSenderPresence(true);
  senderPresenceTimer=setInterval(()=>publishSenderPresence(true),30000);
}
function runtimeSemanticKey(info={}){
  return JSON.stringify([
    Number(state&&state.sourceRevision)||0,
    info.isLive===true?"live":(info.isLive===false?"vod":"unknown"),
    info.dvrAvailable===true?1:(info.dvrAvailable===false?0:null),
    info.delaySupported===true?1:(info.delaySupported===false?0:null)
  ]);
}

async function writeYouTubeRuntime(info={}){
  if(!deviceId||!state||String(state.sourceType)!=="youtube")return;
  const live=info.isLive===true;
  const vod=info.isLive===false;
  try{
    await fbPut(runtimePath(),{
      sourceRevision:Number(state.sourceRevision)||0,
      mediaKind:live?"live":(vod?"vod":"unknown"),
      dvrAvailable:info.dvrAvailable===true?true:(info.dvrAvailable===false?false:null),
      delaySupported:info.delaySupported===true?true:(info.delaySupported===false?false:null),
      currentTime:Number(info.time)||0,
      duration:Number(info.duration)||0,
      liveEdge:Number.isFinite(Number(info.liveEdge))?Number(info.liveEdge):null,
      updatedAt:Date.now(),
      sourceType:"youtube"
    });
    lastRuntimePublishAt=Date.now();
    lastRuntimeSemanticKey=runtimeSemanticKey(info);
  }catch(_){}
}

function publishYouTubeRuntime(info={},force=false){
  if(!deviceId||!state||String(state.sourceType)!=="youtube")return;
  pendingRuntimeInfo={...pendingRuntimeInfo,...info};

  const now=Date.now();
  const semanticKey=runtimeSemanticKey(pendingRuntimeInfo);
  const semanticChanged=semanticKey!==lastRuntimeSemanticKey;
  const elapsed=now-lastRuntimePublishAt;

  if(force || semanticChanged || elapsed>=FIREBASE_RUNTIME_MIN_INTERVAL_MS){
    if(runtimePublishTimer){clearTimeout(runtimePublishTimer);runtimePublishTimer=null}
    const payload=pendingRuntimeInfo;
    pendingRuntimeInfo=null;
    writeYouTubeRuntime(payload);
    return;
  }

  if(!runtimePublishTimer){
    runtimePublishTimer=setTimeout(()=>{
      runtimePublishTimer=null;
      if(!pendingRuntimeInfo)return;
      const payload=pendingRuntimeInfo;
      pendingRuntimeInfo=null;
      writeYouTubeRuntime(payload);
    },Math.max(50,FIREBASE_RUNTIME_MIN_INTERVAL_MS-elapsed));
  }
}

function setStatus(s){statusEl.textContent=s}
function youtubeFeedLoaded(){
  return !!(
    state &&
    String(state.sourceType)==="youtube" &&
    String(state.sourceId||state.sourceUrl||"").trim()
  );
}
function clearEndedScreen(force=false){
  // Once a YouTube video/stream has ended, keep the cover locked on-screen.
  // Routine bridge TIME/STATE messages are noisy at end-of-media and must not
  // briefly reveal the underlying YouTube player between ended notifications.
  if(endedScreenLatched && !force)return;
  if(force)endedScreenLatched=false;
  pendingEndedState=false;
  endedScreen.textContent="";
  endedScreen.classList.remove("visible");
}

function showNoFeedScreen(){
  endedScreenLatched=false;
  pendingEndedState=false;
  youtubePlaybackConfirmed=false;
  endedScreen.textContent="NO VIDEO FEED LOADED";
  endedScreen.classList.add("visible");
}
function showEndedScreen(isLive){
  endedScreenLatched=true;
  endedScreen.textContent="VIDEO FEED ENDED";
  endedScreen.classList.add("visible");
}
function evaluateYoutubeEnded(){
  if(!pendingEndedState||!youtubePlaybackConfirmed)return;
  if(bridgeInfo.isLive===true){
    showEndedScreen(true);
    pendingEndedState=false;
  }else if(bridgeInfo.isLive===false){
    showEndedScreen(false);
    pendingEndedState=false;
  }
}
async function fbPut(url,value){
  const r=await tjkFirebaseFetch(url,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(value)});
  return r.json().catch(()=>null);
}
async function fbDelete(url){await tjkFirebaseFetch(url,{method:"DELETE"})}
function setNestedValue(root,path,data,isPatch){
  const parts=String(path||"/").split("/").filter(Boolean);
  if(!parts.length){if(isPatch&&root&&typeof root==="object"&&data&&typeof data==="object"){Object.assign(root,data);return root}return data&&typeof data==="object"?data:{}}
  let t=root;for(let i=0;i<parts.length-1;i++){const k=parts[i];if(!t[k]||typeof t[k]!=="object")t[k]={};t=t[k]}
  const k=parts[parts.length-1];if(isPatch&&t[k]&&typeof t[k]==="object"&&data&&typeof data==="object")Object.assign(t[k],data);else if(data===null)delete t[k];else t[k]=data;return root
}
function parseYouTubeId(input){
  const s=String(input||"").trim();if(/^[A-Za-z0-9_-]{11}$/.test(s))return s;
  try{const u=new URL(s);if(u.hostname.includes("youtu.be"))return u.pathname.split("/").filter(Boolean)[0]||"";if(u.searchParams.get("v"))return u.searchParams.get("v")||"";const p=u.pathname.split("/").filter(Boolean),i=p.findIndex(x=>["embed","live","shorts"].includes(x));if(i>=0&&p[i+1])return p[i+1]}catch(e){}return ""
}
function sourceKey(s){return JSON.stringify([s&&s.sourceRevision||0,s&&s.sourceId||"",s&&s.sourceUrl||""])}
function bridgeOrigin(){
  try{return new URL(YOUTUBE_BRIDGE_URL).origin}catch(e){return "*"}
}
function postBridge(command,extra={}){
  try{
    if(youtubeBridge&&youtubeBridge.contentWindow){
      youtubeBridge.contentWindow.postMessage({
        tjkYoutubeBridge:true,
        command:String(command||"").toUpperCase(),
        ...extra
      },bridgeOrigin());
    }
  }catch(e){}
}
function currentDelay(){return Math.max(0,Number(state&&state.targetLatencySeconds)||0)}
function bridgeLoad(id){
  clearEndedScreen(true);
  youtubePlaybackConfirmed=false;
  postBridge("LOAD",{videoId:id,delaySeconds:currentDelay()});
  // Every newly selected feed is an autoplay event. Do not inherit a stale
  // paused/playing state from the previous feed.
  postBridge("PLAY");
  setTimeout(()=>postBridge("PLAY"),150);
  setTimeout(()=>postBridge("PLAY"),500);
  setTimeout(()=>postBridge("PLAY"),1200);
}
function bridgePlay(){postBridge("PLAY")}
function bridgePause(){postBridge("PAUSE")}
function bridgeReload(id){
  clearEndedScreen(true);
  youtubePlaybackConfirmed=false;
  postBridge("RELOAD",{videoId:id,delaySeconds:currentDelay()});
  // A reload is also a fresh autoplay event. Give the iframe the same guarded
  // PLAY retries as a normal LOAD so it cannot remain cued/paused after rebuild.
  postBridge("PLAY");
  setTimeout(()=>postBridge("PLAY"),150);
  setTimeout(()=>postBridge("PLAY"),500);
  setTimeout(()=>postBridge("PLAY"),1200);
}
function bridgeGoLive(){postBridge("GO_LIVE",{delaySeconds:currentDelay()})}
function bridgeForceLive(){
  const d=currentDelay();
  postBridge("GO_LIVE",{delaySeconds:d});
  setTimeout(()=>postBridge("GO_LIVE",{delaySeconds:d}),350);
  setTimeout(()=>postBridge("GO_LIVE",{delaySeconds:d}),1000);
}
function bridgeSetDelay(){postBridge("SET_DELAY",{delaySeconds:currentDelay()})}
function bridgeStop(){postBridge("PAUSE")}

youtubeBridge.addEventListener("load",()=>{
  if(!bridgeReady){
    setStatus("YouTube bridge loaded; connecting playback controls…");
    postBridge("PING");
  }
});
// Handshake recovery: READY can be missed when the bridge boots before the
// parent listener or when the browser delays cross-origin iframe messages.
// Only retry a tiny control packet; never reload a playing video.
setInterval(()=>{
  if(deviceId && !bridgeReady)postBridge("PING");
},1200);
youtubeBridge.src=YOUTUBE_BRIDGE_URL;

window.addEventListener("message",event=>{
  if(event.origin!==bridgeOrigin() || event.source!==youtubeBridge.contentWindow)return;
  const data=event.data||{};
  if(data.tjkYoutubeBridge!==true)return;

  const bt=String(data.type||"").toUpperCase();
  if(bt==="BRIDGE_READY" || bt==="READY"){
    if(bridgeReady)return;
    bridgeReady=true;
    lastCommandId="";
    ensureYouTube().then(()=>{
      if(!state||String(state.sourceType)!=="youtube")return;
      // Re-apply the authoritative state after every bridge/iframe rebuild.
      if(state.command==="reload")bridgeReload((parseYouTubeId(state.sourceUrl)||parseYouTubeId(state.sourceId)||""));
      else if(state.command==="golive"||state.command==="delay")bridgeGoLive();
      else if(state.playing===false)bridgePause();
      else bridgePlay();
    }).catch(console.error);
  }else if(["TIME","STATE","LIVE_STATUS","GO_LIVE","BOOTSTRAP_READY","YOUTUBE_READY","LOAD_CALLED","LOAD_RECEIVED","VIDEO_ENDED","ENDED"].includes(bt)){
    bridgeInfo={
      isLive:typeof data.isLive==="boolean"?data.isLive:bridgeInfo.isLive,
      dvrAvailable:data.dvrAvailable,
      delaySupported:data.delaySupported,
      duration:Number(data.duration)||bridgeInfo.duration||0,
      time:Number.isFinite(Number(data.time))?Number(data.time):bridgeInfo.time,
      seekableStart:data.seekableStart,
      seekableEnd:data.seekableEnd,
      liveEdge:data.liveEdge
    };

    const playerState=Number(data.state);
    if(playerState===1 || playerState===3 || Number(data.time)>0){
      youtubePlaybackConfirmed=true;
      if(playerState!==0)clearEndedScreen();
    }

    if(data.streamEnded===true){
      youtubePlaybackConfirmed=true;
      pendingEndedState=false;
      showEndedScreen(true);
    }else if(data.videoEnded===true){
      youtubePlaybackConfirmed=true;
      pendingEndedState=false;
      showEndedScreen(false);
    }else if(playerState===1 || playerState===3){
      // Playing/buffering is not an end condition. In particular, YouTube can
      // briefly report state 0/-1 while a newly loaded video is still starting.
      // Treat only the bridge's explicit videoEnded/streamEnded flags as final.
      pendingEndedState=false;
    }

    // Do not infer an ended video from a transient player state. The bridge's
    // explicit videoEnded/streamEnded signals above are authoritative.
    publishYouTubeRuntime(data);
  }else if(bt==="ERROR"){
    setStatus("YouTube bridge error: "+String(data.error??"unknown"));
  }
});

async function ensureYouTube(){
  if(!state||String(state.sourceType)!=="youtube")return;
  if(!bridgeReady){setStatus("Waiting for HTTPS YouTube bridge. Confirm youtube-bridge.html is deployed on GitHub Pages.");return;}
  const id=parseYouTubeId(state.sourceUrl)||parseYouTubeId(state.sourceId)||"";
  if(!id){setStatus("YouTube source has no readable video ID.");return}
  const key=sourceKey(state);
  if(key!==lastSourceKey){
    lastSourceKey=key;
    lastCommandId="";
    clearEndedScreen(true);
    youtubePlaybackConfirmed=false;
    bridgeLoad(id);
    // LOAD itself autoplays and applies targetLatencySeconds at the live edge.
    // Do not mark the current command handled before the new bridge player is ready.
    setStatus("YouTube source loaded through HTTPS bridge and autoplaying.");
    return;
  }
  applyCommand();
}
function applyCommand(){
  if(!state||!bridgeReady)return;
  const cid=String(state.commandId||"");
  if(cid&&cid===lastCommandId)return;
  if(cid)lastCommandId=cid;

  if(state.command==="pause"||state.playing===false){
    bridgePause();
  }else if(state.command==="play"){
    // VOD resumes normally; confirmed live rejoins live-edge minus delay.
    if(bridgeInfo.isLive===true)bridgeForceLive();
    else bridgePlay();
  }else if(state.command==="reload"){
    const id=parseYouTubeId(state.sourceUrl)||parseYouTubeId(state.sourceId)||"";
    if(id)bridgeReload(id);
  }else if(state.command==="golive"){
    bridgeForceLive();
  }else if(state.command==="delay"){
    if(bridgeInfo.isLive===true)bridgeSetDelay();
  }else if(state.command==="clear"){
    bridgePause();
  }else{
    bridgePlay();
  }
}
async function processState(){
  const next=firebaseView&&firebaseView.state;
  if(next&&typeof next==="object"){
    state=next;
    if(String(state.sourceType)==="youtube" && String(state.sourceId||state.sourceUrl||"").trim()){
      // Do NOT clear the ended overlay on routine Firebase state/runtime updates.
      // The overlay is cleared only when a new/reloaded YouTube source is actually loaded.
      if(!bridgeReady){endedScreen.textContent="CONNECTING TO YOUTUBE PLAYER";endedScreen.classList.add("visible");}
      await ensureYouTube();
    }else{
      lastSourceKey="";
      lastCommandId="";
      postBridge("PAUSE");
      showNoFeedScreen();
      setStatus("NO VIDEO FEED LOADED");
    }
  }else{
    state=null;
    lastSourceKey="";
    lastCommandId="";
    postBridge("PAUSE");
    showNoFeedScreen();
    setStatus("NO VIDEO FEED LOADED");
  }

}
async function openStream(){
  if(firebaseStream)try{firebaseStream.close()}catch(e){}
  firebaseView={};tjkFirebaseStreamHealthy=false;
  try{await tjkSelectFirebaseServer()}
  catch(err){setStatus("Firebase unavailable.");startFirebaseFallbackPolling();return}
  firebaseStream=new EventSource(`${FIREBASE_BASE}/devices/${encodeURIComponent(deviceId)}/videoUnified.json`);
  const handle=(ev,patch)=>{try{const m=JSON.parse(ev.data||"{}");firebaseView=setNestedValue(firebaseView,m.path,m.data,patch);processState().catch(console.error)}catch(e){console.error(e)}};
  firebaseStream.addEventListener("put",e=>handle(e,false));firebaseStream.addEventListener("patch",e=>handle(e,true));
  firebaseStream.onopen=()=>{tjkFirebaseStreamHealthy=true;stopFirebaseFallbackPolling();if(!state||String(state.sourceType)!=="youtube"){setStatus("NO VIDEO FEED LOADED");showNoFeedScreen();}};
  firebaseStream.onerror=()=>{tjkFirebaseStreamHealthy=false;startFirebaseFallbackPolling();setStatus("Firebase reconnecting…")};
}
function stopFirebaseFallbackPolling(){
  if(tjkFirebaseFallbackTimer){clearInterval(tjkFirebaseFallbackTimer);tjkFirebaseFallbackTimer=null}
}
function startFirebaseFallbackPolling(){
  if(tjkFirebaseFallbackTimer||!deviceId)return;
  const poll=async()=>{
    if(tjkFirebaseStreamHealthy){stopFirebaseFallbackPolling();return}
    try{
      const data=await fbGet(`${FIREBASE_BASE}/devices/${encodeURIComponent(deviceId)}/videoUnified.json`);
      if(data&&typeof data==="object"){firebaseView=data;await processState()}
    }catch(_){}
  };
  poll();tjkFirebaseFallbackTimer=setInterval(poll,TJK_FIREBASE_FALLBACK_POLL_MS);
}
async function connect(){
  const id=cleanDeviceId(deviceInput.value);
  if(!id){setStatus("Enter a valid Device ID.");return}
  deviceId=id;
  try{sessionStorage.setItem(DEVICE_TAB_SESSION_KEY,id)}catch(_){}
  try{localStorage.removeItem(DEVICE_KEY)}catch(_){}

  // Connect to the selected Device ID; OBS captures this browser directly.
  openStream();
  startSenderPresence();
  gate.classList.remove("visible");
  gate.classList.add("hidden");
  toolbar.classList.remove("hidden");
  setStatus("Connecting to video controls…");
  showNoFeedScreen();
}
connectBtn.onclick=connect;

async function enterFullscreen(){
  try{
    const target=document.documentElement;
    if(document.fullscreenElement||document.webkitFullscreenElement){
      if(document.exitFullscreen)await document.exitFullscreen();
      else if(document.webkitExitFullscreen)document.webkitExitFullscreen();
      return;
    }
    if(target.requestFullscreen){
      await target.requestFullscreen();
      return;
    }
    if(target.webkitRequestFullscreen){
      target.webkitRequestFullscreen();
      return;
    }
  }catch(err){
    console.warn("Wix iframe blocked fullscreen:",err);
  }

  // Wix fallback: open this player standalone and hand off the confirmed Device ID.
  try{
    const u=new URL(window.location.href);
    const activeDevice=cleanDeviceId(deviceId||sessionStorage.getItem(DEVICE_TAB_SESSION_KEY)||"");
    if(activeDevice){
      u.searchParams.set("device",activeDevice);
      u.searchParams.set("standalone","1");
    }
    const w=window.open(u.toString(),"_blank");
    if(!w)setStatus("Fullscreen blocked. Allow pop-ups or open this player directly.");
  }catch(err){
    setStatus("Fullscreen fallback failed: "+err.message);
  }
}

fullscreenBtn.onclick=enterFullscreen;

function updateFullscreenButton(){
  const active=!!(document.fullscreenElement||document.webkitFullscreenElement);
  fullscreenBtn.textContent="⛶";
  fullscreenBtn.title=active?"Exit Full Screen":"Full Screen";
}
document.addEventListener("fullscreenchange",updateFullscreenButton);
document.addEventListener("webkitfullscreenchange",updateFullscreenButton);

changeBtn.onclick=()=>{
  gate.classList.remove("hidden");
  gate.classList.add("visible");
  toolbar.classList.add("hidden");
  connectBtn.classList.remove("hidden");
};
try{
  // Login belongs to this browser tab only:
  // refresh/reload keeps it, while a newly opened tab asks for a fresh login.
  const savedDevice=cleanDeviceId(sessionStorage.getItem(DEVICE_TAB_SESSION_KEY)||"");
  let handoffDevice="";
  let standaloneHandoff=false;
  try{
    const q=new URLSearchParams(window.location.search||"");
    standaloneHandoff=q.get("standalone")==="1";
    handoffDevice=cleanDeviceId(q.get("device")||"");
  }catch(_){}

  // Fullscreen fallback is an intentional authenticated handoff.
  if(standaloneHandoff && handoffDevice){
    try{sessionStorage.setItem(DEVICE_TAB_SESSION_KEY,handoffDevice)}catch(_){}
    deviceInput.value=handoffDevice;
    gate.classList.remove("visible");
    gate.classList.add("hidden");
    setTimeout(()=>connect(),150);
  }else if(savedDevice){
    deviceInput.value=savedDevice;
    gate.classList.remove("visible");
    gate.classList.add("hidden");
    setTimeout(()=>connect(),150);
  }else{
    deviceInput.value="";
    gate.classList.remove("hidden");
    gate.classList.add("visible");
  }
}catch(e){
  gate.classList.remove("hidden");
  gate.classList.add("visible");
}
// No WebRTC capture button remains.

window.addEventListener("pagehide",()=>{
  if(!deviceId)return;
  try{fetch(senderPresencePath(),{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({online:false,deviceId,lastSeen:Date.now(),page:"youtube-player"}),cache:"no-store",keepalive:true}).catch(()=>{})}catch(_){}
});
</script>

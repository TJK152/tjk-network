<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>TJK YouTube Bridge</title>
<style>
html,body,#player{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
#telemetry{position:absolute;left:12px;top:12px;z-index:99;display:none;background:rgba(0,0,0,.9);color:#fff;
border:2px solid #007DFF;border-radius:8px;padding:10px;font:14px/1.35 monospace;white-space:pre-wrap}
</style>
</head>
<body>
<div id="player"></div><div id="telemetry"></div>
<script>
"use strict";
let player=null,apiReady=false,playerReady=false;
let pendingLoad=null,lastCommand="NONE",lastVideoId="",lastState=-1,lastError=null;
let loadReceived=false,loadCalled=false,stateFired=false,errorFired=false;

function send(type,extra={}){
  let time=0,duration=0,videoUrl="",videoData=null;
  try{if(player){time=Number(player.getCurrentTime())||0;duration=Number(player.getDuration())||0;
    videoUrl=String(player.getVideoUrl&&player.getVideoUrl()||"");
    videoData=player.getVideoData&&player.getVideoData()||null;}}catch(_){}
  const payload={tjkYoutubeBridge:true,type,state:lastState,time,duration,error:lastError,
    loadReceived,loadCalled,stateFired,errorFired,lastCommand,videoId:lastVideoId,videoUrl,videoData,
    playerReady,apiReady,...extra};
  try{parent.postMessage(payload,"*")}catch(_){}
  render(payload);
}
function render(p){
  if(new URLSearchParams(location.search).get("debug")!=="1")return;
  const el=document.getElementById("telemetry"); el.style.display="block";
  el.textContent="TJK YOUTUBE BRIDGE\n"+
    "API ready: "+p.apiReady+"\nPlayer ready: "+p.playerReady+
    "\nLOAD received: "+p.loadReceived+"\nloadVideoById called: "+p.loadCalled+
    "\nVideo ID: "+p.videoId+"\nState: "+p.state+
    "\nDuration: "+p.duration+"\nTime: "+p.time+
    "\nError: "+p.error+"\nLast command: "+p.lastCommand;
}
function doLoad(id){
  id=String(id||"").trim(); if(!id)return;
  lastVideoId=id; loadCalled=true; lastCommand="LOAD";
  try{
    // Use loadVideoById so the media pipeline actually initializes.
    player.loadVideoById({videoId:id,startSeconds:0});
    send("LOAD_CALLED");
  }catch(e){lastError="LOAD_EXCEPTION: "+e.message;send("ERROR",{error:lastError});}
}
window.onYouTubeIframeAPIReady=()=>{
  apiReady=true;
  player=new YT.Player("player",{
    width:"100%",height:"100%",
    playerVars:{autoplay:0,controls:0,playsinline:1,rel:0,modestbranding:1,cc_load_policy:0,iv_load_policy:3,fs:0},
    events:{
      onReady:()=>{
        playerReady=true; send("READY");
        if(pendingLoad){const id=pendingLoad;pendingLoad=null;doLoad(id);}
      },
      onStateChange:e=>{
        stateFired=true;lastState=Number(e.data);
        // The bridge bootstrap may start media only to initialize metadata.
        // Pause immediately once duration becomes usable; local OBS master decides final seek/play.
        let d=0;try{d=Number(player.getDuration())||0}catch(_){}
        if(loadCalled && d>0 && (lastState===1 || lastState===3 || lastState===5)){
          try{player.pauseVideo()}catch(_){}
        }
        send("STATE");
      },
      onError:e=>{errorFired=true;lastError=Number(e.data);send("ERROR");}
    }
  });
};
window.addEventListener("message",ev=>{
  const m=ev.data;
  if(!m||m.tjkYoutubeBridge!==true||!m.command)return;
  lastCommand=String(m.command);
  if(m.command==="LOAD"){
    loadReceived=true;lastVideoId=String(m.videoId||"");send("LOAD_RECEIVED");
    if(playerReady)doLoad(lastVideoId); else pendingLoad=lastVideoId;
  }else if(m.command==="PLAY"){try{player.playVideo()}catch(_){}}
  else if(m.command==="PAUSE"){try{player.pauseVideo()}catch(_){}}
  else if(m.command==="SEEK"){try{player.seekTo(Math.max(0,Number(m.seconds)||0),true)}catch(_){}}
  else if(m.command==="GET_STATE"||m.command==="GET_TIME"){send("SNAPSHOT");}
});
setInterval(()=>{
  // If metadata appears without a state callback, freeze bootstrap and report it.
  if(playerReady){
    let d=0;try{d=Number(player.getDuration())||0}catch(_){}
    if(loadCalled && d>0 && lastState===1){try{player.pauseVideo()}catch(_){}}
  }
  send("TIME");
},250);
const s=document.createElement("script");
s.src="https://www.youtube.com/iframe_api";
document.head.appendChild(s);
</script>
</body>
</html>

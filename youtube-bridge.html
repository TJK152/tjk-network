<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>TJK YouTube Bridge</title>
<style>
html,body,#host{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
</style>
</head>
<body>
<div id="host"></div>
<script>
"use strict";

/*
  TJK HTTPS YouTube bridge — no iframe_api script.

  OBS successfully loads this HTTPS page, but its nested environment did not
  initialize https://www.youtube.com/iframe_api. This version talks directly
  to an enablejsapi=1 YouTube embed using YouTube's iframe postMessage
  protocol, removing that failed script-loader dependency.
*/

const ORIGIN=location.origin;
let ytFrame=null;
let ytWindow=null;
let currentVideoId="";
let ytReady=false;
let state=-1;
let currentTime=0;
let duration=0;
let lastError=null;
let loadReceived=false;
let loadCalled=false;
let stateFired=false;
let errorFired=false;
let lastCommand="NONE";
let listenSent=false;
let isLive=null,bootstrapMuted=false,bootstrapComplete=false,streamEnded=false,endReason="",videoEnded=false;
let desiredVolume=100;
let desiredMuted=false;

function emit(type,extra={}){
  try{
    parent.postMessage({
      tjkYoutubeBridge:true,
      type,
      state,
      time:currentTime,
      duration,
      error:lastError,
      loadReceived,
      loadCalled,
      stateFired,
      errorFired,
      lastCommand,
      videoId:currentVideoId,
      videoUrl:currentVideoId ? "https://www.youtube.com/watch?v="+currentVideoId : "",
      playerReady:ytReady,
      apiReady:ytReady,
      isLive,
      streamEnded,
      endReason,
      videoEnded,
      ...extra
    },"*");
  }catch(_){}
}

function ytPost(obj){
  if(!ytWindow)return;
  try{ytWindow.postMessage(JSON.stringify(obj),"https://www.youtube.com");}catch(_){
    try{ytWindow.postMessage(JSON.stringify(obj),"*");}catch(__){}
  }
}

function command(func,args=[]){
  ytPost({event:"command",func,args});
}

function requestInfo(){
  // These commands cause infoDelivery updates on supported YouTube embeds.
  command("getCurrentTime");
  command("getDuration");
  command("getPlayerState");
  command("getVideoData");
}

function beginBootstrap(){
  if(!ytWindow||bootstrapComplete||bootstrapMuted)return;
  bootstrapMuted=true; command("mute"); command("playVideo");
}
function applyDesiredAudio(){
  command("setVolume",[Math.max(0,Math.min(100,Number(desiredVolume)||0))]);
  command(desiredMuted?"mute":"unMute");
}
function finishBootstrap(){
  if(bootstrapComplete)return;
  bootstrapComplete=true; bootstrapMuted=false;
  command("pauseVideo");
  applyDesiredAudio();
  emit("BOOTSTRAP_READY");
}
function attachListeners(){
  if(!ytWindow||listenSent)return;
  listenSent=true;
  ["onReady","onStateChange","onError","onPlaybackQualityChange"].forEach(event=>{
    ytPost({event:"command",func:"addEventListener",args:[event]});
  });
  // YouTube's iframe protocol uses this handshake for API communication.
  ytPost({event:"listening",id:"tjkYoutube"});
}

function buildEmbed(id){
  currentVideoId=String(id||"").trim();
  if(!currentVideoId)return;
  ytReady=false; listenSent=false; state=-1; currentTime=0; duration=0; lastError=null;
  stateFired=false; errorFired=false; loadCalled=true; isLive=null; bootstrapMuted=false; bootstrapComplete=false; streamEnded=false; endReason=""; videoEnded=false;

  const p=new URLSearchParams({
    enablejsapi:"1",
    autoplay:"1",
    controls:"0",
    playsinline:"1",
    rel:"0",
    modestbranding:"1",
    cc_load_policy:"0",
    iv_load_policy:"3",
    fs:"0",
    origin:ORIGIN
  });

  const f=document.createElement("iframe");
  f.id="youtube";
  f.allow="autoplay; encrypted-media; picture-in-picture";
  f.referrerPolicy="strict-origin-when-cross-origin";
  f.src="https://www.youtube.com/embed/"+encodeURIComponent(currentVideoId)+"?"+p.toString();
  f.onload=()=>{
    ytWindow=f.contentWindow;
    // Repeat handshake because the player may not accept the first packet
    // until its internal JS has finished booting.
    let tries=0;
    const t=setInterval(()=>{
      if(!ytFrame||ytFrame!==f){clearInterval(t);return}
      ytPost({event:"listening",id:"tjkYoutube"});
      attachListeners();
      requestInfo();
      if(tries===2)beginBootstrap();
      if(++tries>=20)clearInterval(t);
    },250);
  };
  const host=document.getElementById("host");
  host.innerHTML="";
  host.appendChild(f);
  ytFrame=f;
  ytWindow=f.contentWindow;
  emit("LOAD_CALLED");
}

function handleYouTubeMessage(ev){
  if(!ytWindow||ev.source!==ytWindow)return;
  let m=ev.data;
  try{if(typeof m==="string")m=JSON.parse(m)}catch(_){return}
  if(!m||typeof m!=="object")return;

  if(m.event==="onReady"){
    ytReady=true;
    emit("READY");
    requestInfo();
    return;
  }

  if(m.event==="onStateChange"){
    ytReady=true;
    stateFired=true;
    state=Number(m.info);
    if(state===0 && isLive===true){
      streamEnded=true;
      endReason="YouTube live player entered ENDED state";
      command("pauseVideo");
      emit("ENDED");
      return;
    }
    if(state===0 && isLive===false){
      videoEnded=true;
      command("pauseVideo");
      emit("VIDEO_ENDED");
      return;
    }
    emit("STATE");
    requestInfo();
    return;
  }

  if(m.event==="onError"){
    ytReady=true;
    errorFired=true;
    lastError=m.info;
    emit("ERROR");
    return;
  }

  if(m.event==="infoDelivery" && m.info){
    ytReady=true;
    const info=m.info;
    const vd=info.videoData;
    if(vd&&typeof vd.isLive==="boolean")isLive=vd.isLive;
    else if(vd&&typeof vd.isLiveContent==="boolean")isLive=vd.isLiveContent;
    if(isLive===true && state===0 && !streamEnded){
      streamEnded=true;
      endReason="YouTube live metadata confirmed after ENDED state";
      command("pauseVideo");
      emit("ENDED");
    }
    if(Number.isFinite(Number(info.currentTime)))currentTime=Number(info.currentTime);
    if(Number.isFinite(Number(info.duration)))duration=Number(info.duration);
    if(Number.isFinite(Number(info.playerState))){
      const next=Number(info.playerState);
      if(next!==state){state=next;stateFired=true;emit("STATE");}
    }
    if(!bootstrapComplete&&duration>0)finishBootstrap();
    emit("TIME");
  }
}

window.addEventListener("message",ev=>{
  // Messages from the YouTube child iframe.
  if(ytWindow && ev.source===ytWindow){
    handleYouTubeMessage(ev);
    return;
  }

  // Commands from the local OBS parent.
  const m=ev.data;
  if(!m||m.tjkYoutubeBridge!==true||!m.command)return;
  lastCommand=String(m.command);

  if(m.command==="LOAD"){
    loadReceived=true;
    currentVideoId=String(m.videoId||"").trim();
    emit("LOAD_RECEIVED");
    buildEmbed(currentVideoId);
  }else if(m.command==="PLAY"){
    if(!streamEnded&&!videoEnded)command("playVideo");
  }else if(m.command==="PAUSE"){
    if(!bootstrapMuted)command("pauseVideo");
  }else if(m.command==="SEEK"){
    if(!streamEnded&&!videoEnded)command("seekTo",[Math.max(0,Number(m.seconds)||0),true]);
  }else if(m.command==="SET_VOLUME"){
    desiredVolume=Math.max(0,Math.min(100,Number(m.volume)||0));
    command("setVolume",[desiredVolume]);
    if(desiredMuted)command("mute");
  }else if(m.command==="MUTE"){
    desiredMuted=true;
    command("mute");
  }else if(m.command==="UNMUTE"){
    desiredMuted=false;
    command("setVolume",[desiredVolume]);
    command("unMute");
  }else if(m.command==="GET_STATE"||m.command==="GET_TIME"){
    requestInfo();
  }
});

// The local player waits for bridge READY before sending LOAD. This READY is
// bridge-document readiness, not YouTube readiness.
emit("READY");

setInterval(()=>{
  if(ytWindow){
    ytPost({event:"listening",id:"tjkYoutube"});
    attachListeners();
    requestInfo();
    if(!bootstrapComplete&&!bootstrapMuted)beginBootstrap();
  }
  emit("TIME");
},250);
</script>
</body>
</html>

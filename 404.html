<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>TJK NETWORK</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
#websiteFrame{position:absolute;top:0;left:0;width:100%;height:100%;border:0;margin:0;padding:0;display:block;transform-origin:top left}
</style></head><body>
<iframe id="websiteFrame" allow="autoplay; fullscreen" allowfullscreen></iframe>
<script>
(()=>{
const WIX_ORIGIN="https://www.tjk152.com";
const GITHUB_BASE="/tjk-network/website";
const WIX_MOBILE_WIDTH=320;
const MOBILE_BREAKPOINT=768;
const frame=document.getElementById("websiteFrame");

function applyResponsiveFrame(){
 const vw=window.innerWidth, vh=window.innerHeight;
 if(vw<=MOBILE_BREAKPOINT){
   const scale=vw/WIX_MOBILE_WIDTH;
   frame.style.left="0";
   frame.style.top="0";
   frame.style.width=WIX_MOBILE_WIDTH+"px";
   frame.style.height=(vh/scale)+"px";
   frame.style.transformOrigin="top left";
   frame.style.transform=`scale(${scale})`;
 }else{
   frame.style.left="0";
   frame.style.top="0";
   frame.style.width="100%";
   frame.style.height="100%";
   frame.style.transform="none";
 }
}

function getWixPath(){
 let path=window.location.pathname||"/";
 if(path===GITHUB_BASE||path===GITHUB_BASE+"/") path="/";
 else if(path.startsWith(GITHUB_BASE+"/")) path=path.slice(GITHUB_BASE.length);
 else path="/";
 if(!path.startsWith("/")) path="/"+path;
 return path;
}

applyResponsiveFrame();
window.addEventListener("resize",applyResponsiveFrame);
window.addEventListener("orientationchange",()=>{
 requestAnimationFrame(()=>requestAnimationFrame(applyResponsiveFrame));
});
frame.src=WIX_ORIGIN+getWixPath()+(window.location.search||"");
})();
</script></body></html>

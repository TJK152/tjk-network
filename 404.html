<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TJK NETWORK</title>

<style>
html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

#websiteFrame {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
    margin: 0;
    padding: 0;
    display: block;
}
</style>
</head>

<body>

<iframe
    id="websiteFrame"
    allow="autoplay; fullscreen"
    allowfullscreen>
</iframe>

<script>
(() => {
    /*
      GitHub Pages test location:
      https://tjk152.github.io/tjk-network/website/

      Examples:
      /tjk-network/website/shop
          -> https://www.tjk152.com/shop

      /tjk-network/website/schedule
          -> https://www.tjk152.com/schedule

      /tjk-network/website/
          -> https://www.tjk152.com/

      This test version intentionally has NO 50px crop.
    */

    const WIX_ORIGIN = "https://www.tjk152.com";
    const GITHUB_BASE = "/tjk-network/website";

    const frame = document.getElementById("websiteFrame");

    let path = window.location.pathname || "/";

    // Remove the GitHub project/folder prefix.
    if (path === GITHUB_BASE || path === GITHUB_BASE + "/") {
        path = "/";
    } else if (path.startsWith(GITHUB_BASE + "/")) {
        path = path.slice(GITHUB_BASE.length);
    } else {
        path = "/";
    }

    // Ensure the destination is always a path on the approved site.
    if (!path.startsWith("/")) {
        path = "/" + path;
    }

    // Preserve the visitor's query string.
    const query = window.location.search || "";

    frame.src = WIX_ORIGIN + path + query;
})();
</script>

</body>
</html>

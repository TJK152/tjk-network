<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>STAFF VIEWER</title>
<style>
:root{
  --blue:#004CBF;
  --border:#007DFF;
  --white:#FFFFFF;
  --buttonText:#0326FF;
}
*{box-sizing:border-box}
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  color:#fff;
  font-family:Arial,sans-serif;
}
body{display:flex;flex-direction:column}
#viewer{
  position:relative;
  flex:1 1 auto;
  min-height:0;
  background:#000;
}
#htmlVideo,#rawVideo,#youtubeHost{pointer-events:none;
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  background:#000;
}
#htmlVideo,#rawVideo{
  object-fit:contain;
  image-rendering:auto;
}
#youtubeHost iframe{
  width:100%!important;
  height:100%!important;
  pointer-events:none!important;
}
#loginProcessingVeil{
  position:absolute;
  inset:0;
  z-index:9;
  background:#000;
  display:none;
  pointer-events:none;
}
#youtubeEndCover{
  position:absolute;
  inset:0;
  z-index:9;
  background:#000;
  display:none;
  pointer-events:none;
}
.hidden{display:none!important}
#centerStatus{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  z-index:10;
  max-width:min(760px,calc(100vw - 40px));
  padding:12px 16px;
  border-radius:10px;
  background:rgba(0,0,0,.74);
  text-align:center;
  font-weight:bold;
  line-height:1.4;
  white-space:pre-wrap;
}
#connectionStatus{
  position:absolute;
  top:12px;
  left:12px;
  z-index:11;
  padding:8px 11px;
  border-radius:8px;
  background:rgba(0,0,0,.68);
  font-size:13px;
  font-weight:bold;
  line-height:1.35;
  pointer-events:none;
}
#sourceBadge{
  position:absolute;
  top:12px;
  right:12px;
  z-index:11;
  padding:8px 11px;
  border-radius:8px;
  background:rgba(0,0,0,.68);
  font-size:13px;
  font-weight:bold;
  pointer-events:none;
}
#controls{
  flex:0 0 auto;
  background:var(--blue);
  border-top:5px solid var(--border);
  padding:10px 14px calc(10px + env(safe-area-inset-bottom));
}
#controlInner{
  max-width:1250px;
  margin:0 auto;
  display:grid;
  grid-template-columns:auto auto minmax(220px,1fr) auto auto auto;
  gap:10px;
  align-items:center;
}
button,select,input{font:inherit}
button,select{
  min-height:48px;
  border:4px solid var(--border);
  border-radius:10px;
  background:#fff;
  color:var(--buttonText);
  font-weight:bold;
}
button{
  min-width:58px;
  padding:7px 13px;
  cursor:pointer;
}
button:not(:disabled):hover{background:#0093FF;color:#fff}
button:disabled,select:disabled,input:disabled{cursor:default!important;pointer-events:none!important}
#playPause,#syncButton,#mute,#fullscreen{
  width:52px;
  min-width:52px;
  height:52px;
  min-height:52px;
  padding:0;
  border-radius:10px;
  display:flex;
  align-items:center;
  justify-content:center;
  flex:0 0 52px;
  font-size:23px;
}
#playPause{
  font-family:Arial,sans-serif;
  font-weight:700;
  font-size:22px;
  letter-spacing:normal;
  line-height:normal;
  padding:0;
}
#volumeBox{
  min-width:220px;
  display:grid;
  grid-template-columns:auto 1fr auto;
  gap:8px;
  align-items:center;
}
#volume{width:100%;accent-color:#FFFFFF;transition:filter 160ms ease,opacity 160ms ease}
#volume.mutedVisual{filter:grayscale(1);opacity:1;accent-color:#808080}
#volumeValue{
  min-width:43px;
  text-align:right;
  font-weight:bold;
}
#quality{
  height:52px;
  min-height:52px;
  padding:5px 9px;
}
#changeDevice{
  min-width:112px;
  height:52px;
  min-height:52px;
}
button:disabled,select:disabled{opacity:.45}
#deviceModal{
  position:fixed;
  inset:0;
  z-index:50;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:rgba(0,0,0,.88);
}
#deviceCard{
  width:min(520px,100%);
  padding:22px;
  border:5px solid var(--border);
  border-radius:15px;
  background:var(--blue);
}
#deviceCard h1{margin:0 0 8px;font-size:24px}
#deviceCard p{margin:0 0 15px;line-height:1.4}
#deviceInput{
  width:100%;
  height:50px;
  padding:9px 11px;
  border:5px solid var(--border);
  border-radius:9px;
  background:#fff;
  color:#0326FF;
  font-weight:bold;
}
#connectButton{width:100%;margin-top:10px}
#modalStatus{
  min-height:18px;
  margin-top:10px;
  font-size:13px;
  font-weight:bold;
}
@media(max-width:820px){
  #controlInner{grid-template-columns:auto 1fr auto}
  #volumeBox{grid-column:1/-1;grid-row:2}
  #quality{width:100%}
  #changeDevice{display:none}
}

body.fullscreen-idle #controls,
body.fullscreen-idle #topBar{opacity:0;pointer-events:none;}
#controls,#topBar{transition:opacity 200ms ease;}

/* HLS DIAGNOSTICS — display-only; does not change playback/sync behavior. */
#hlsDiagnostics{
  position:absolute;
  left:12px;
  top:58px;
  z-index:20;
  width:min(520px,calc(100vw - 24px));
  max-height:calc(100% - 78px);
  overflow:auto;
  display:none;
  padding:10px 12px;
  border:2px solid var(--border);
  border-radius:8px;
  background:rgba(0,0,0,.90);
  color:#fff;
  font:12px/1.35 Arial,sans-serif;
  white-space:pre-wrap;
  word-break:break-word;
  pointer-events:auto;
}
#sourceBadge.hlsDiagnosticAvailable{
  pointer-events:auto;
  cursor:pointer;
  user-select:none;
}

#hlsTapToStart{
  position:absolute;
  inset:0;
  z-index:80;
  display:none;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,.72);
  cursor:pointer;
  pointer-events:auto;
}
#hlsTapToStart button{
  min-width:min(420px,calc(100vw - 40px));
  min-height:70px;
  padding:14px 24px;
  border:5px solid var(--border);
  border-radius:14px;
  background:#fff;
  color:var(--buttonText);
  font-size:22px;
  font-weight:bold;
  cursor:pointer;
}

</style>
</head>
<body>

<div id="viewer">
  <video id="htmlVideo" playsinline preload="auto" disableRemotePlayback></video>
  <video id="rawVideo" playsinline autoplay class="hidden"></video>
  <div id="youtubeHost" class="hidden"></div>
  <div id="youtubeEndCover"></div>
  <div id="loginProcessingVeil"></div>
  <div id="centerStatus">Enter the Device ID to connect.</div>
  <div id="connectionStatus">DISCONNECTED</div>
  <div id="sourceBadge">OFF</div>
  <div id="hlsDiagnostics" aria-live="polite"></div>
  <div id="hlsTapToStart"><button id="hlsTapToStartButton" type="button">▶ TAP TO START VIDEO</button></div>
</div>

<div id="controls">
  <div id="controlInner">
    <button id="playPause" type="button" title="Pause / Play">Ⅱ</button>
    <button id="syncButton" type="button" title="Sync to OBS">🔄</button>

    <div id="volumeBox">
      <button id="mute" type="button" title="Mute / Unmute">🔊</button>

      <div id="volumeValue">100%</div>
    </div>

    <select id="quality" aria-label="Video quality">
      <option value="auto" selected>Auto</option>

      <option value="720">720p30</option>
      <option value="540">540p30</option>
      <option value="480">480p30</option>
      <option value="360">360p30 — Low Data</option>
    </select>

    <button id="changeDevice" type="button">DEVICE ID</button>
    <button id="fullscreen" type="button" title="Full Screen">⛶</button>
  </div>
</div>

<div id="deviceModal">
  <div id="deviceCard">
    <h1>TJK NETWORK STAFF VIDEO</h1>
    <p>Enter the Device ID for the active TJK NETWORK broadcast.</p>
    <input id="deviceInput" type="text" autocomplete="off" spellcheck="false" placeholder="DEVICE ID">
    <button id="connectButton" type="button">CONNECT</button>
    <div id="modalStatus"></div>
  </div>
</div>

<script>
"use strict";

const FIREBASE_PRIMARY="https://tjk-network-controls-default-rtdb.firebaseio.com";
const FIREBASE_BACKUP="https://tjk-network-controls-backup-default-rtdb.firebaseio.com";
let FIREBASE_BASE=FIREBASE_PRIMARY;
let tjkFirebaseSelectionPromise=null;
let tjkFirebaseStreamHealthy=false;
let tjkFirebaseFallbackTimer=null;
const TJK_FIREBASE_FALLBACK_POLL_MS=500;

function tjkFirebaseTranslateUrl(url,base){
  const s=String(url||"");
  if(s.startsWith(FIREBASE_PRIMARY))return base+s.slice(FIREBASE_PRIMARY.length);
  if(s.startsWith(FIREBASE_BACKUP))return base+s.slice(FIREBASE_BACKUP.length);
  return s;
}
async function tjkFirebaseFetch(url,options={}){
  const activeUrl=tjkFirebaseTranslateUrl(url,FIREBASE_BASE);
  try{
    const r=await fetch(activeUrl,{...options,cache:"no-store"});
    if(!r.ok){
      const body=await r.text().catch(()=>"");
      const e=new Error(`Firebase ${options.method||"GET"} ${r.status}${body?" — "+body.slice(0,180):""}`);
      e.status=r.status;
      throw e;
    }
    return r;
  }catch(primaryError){
    if(FIREBASE_BASE!==FIREBASE_PRIMARY)throw primaryError;
    const backupUrl=tjkFirebaseTranslateUrl(url,FIREBASE_BACKUP);
    const r=await fetch(backupUrl,{...options,cache:"no-store"});
    if(!r.ok){
      const body=await r.text().catch(()=>"");
      const e=new Error(`Backup Firebase ${options.method||"GET"} ${r.status}${body?" — "+body.slice(0,180):""}`);
      e.status=r.status;
      throw e;
    }
    FIREBASE_BASE=FIREBASE_BACKUP;
    tjkFirebaseStreamHealthy=false;
    setTimeout(()=>{
      try{
        if(typeof openFirebaseStream==="function")openFirebaseStream();
        else if(typeof openStream==="function")openStream();
      }catch(_){}
    },0);
    return r;
  }
}
async function tjkFirebaseProbe(base){
  const r=await fetch(base+"/.json?shallow=true",{method:"GET",cache:"no-store"});
  if(!r.ok)throw new Error(`Firebase probe ${r.status}`);
  return true;
}
async function tjkSelectFirebaseServer(){
  if(FIREBASE_BASE===FIREBASE_BACKUP)return FIREBASE_BASE;
  if(tjkFirebaseSelectionPromise)return tjkFirebaseSelectionPromise;
  tjkFirebaseSelectionPromise=(async()=>{
    try{
      await tjkFirebaseProbe(FIREBASE_PRIMARY);
      FIREBASE_BASE=FIREBASE_PRIMARY;
    }catch(_){
      await tjkFirebaseProbe(FIREBASE_BACKUP);
      FIREBASE_BASE=FIREBASE_BACKUP;
    }
    return FIREBASE_BASE;
  })();
  try{return await tjkFirebaseSelectionPromise}
  finally{tjkFirebaseSelectionPromise=null}
}
async function fbGet(url){
  const r=await tjkFirebaseFetch(url,{method:"GET"});
  return r.json().catch(()=>null);
}
const DEVICE_STORAGE_KEY="tjk-staff-video-device-id-v2";
const DEVICE_TAB_SESSION_KEY="tjk-staff-video-device-tab-session-v1";
const CLIENT_STORAGE_KEY="tjk-staff-video-client-id-v2";
const QUALITY_STORAGE_KEY="tjk-staff-video-quality-v2";
const VOLUME_STORAGE_KEY="tjk-staff-video-volume-v2";
const SAFE_LIVE_LATENCY_SECONDS=5;

const htmlVideo=document.getElementById("htmlVideo");
const rawVideo=document.getElementById("rawVideo");
const youtubeHost=document.getElementById("youtubeHost");
const youtubeEndCover=document.getElementById("youtubeEndCover");
const loginProcessingVeil=document.getElementById("loginProcessingVeil");
const centerStatus=document.getElementById("centerStatus");
const connectionStatus=document.getElementById("connectionStatus");
const sourceBadge=document.getElementById("sourceBadge");
const hlsDiagnostics=document.getElementById("hlsDiagnostics");
const hlsTapToStart=document.getElementById("hlsTapToStart");
const hlsTapToStartButton=document.getElementById("hlsTapToStartButton");
const deviceModal=document.getElementById("deviceModal");
const deviceInput=document.getElementById("deviceInput");
const connectButton=document.getElementById("connectButton");
const modalStatus=document.getElementById("modalStatus");
const playPause=document.getElementById("playPause");
const syncButton=document.getElementById("syncButton");
const muteButton=document.getElementById("mute");
const volume=document.getElementById("volume");
const volumeValue=document.getElementById("volumeValue");
const quality=document.getElementById("quality");
const fullscreen=document.getElementById("fullscreen");
const changeDevice=document.getElementById("changeDevice");

let deviceId="";
let clientId="";
let firebaseStream=null;
let firebaseView={};
let state=null;
let currentSourceKey="";
let locallyPaused=false;
let hls=null;
let hlsJsPromise=null;
let youtubeApiPromise=null;
const YOUTUBE_BRIDGE_URL="https://tjk152.github.io/tjk-network/youtube-bridge.html";
let youtubeBridgeFrame=null;
let youtubeBridgeReady=false;
let youtubeBridgeState=-1;
let youtubeBridgeDuration=0;
let youtubeBridgeTime=0;
let youtubePlayer=null;
let youtubeReady=false;
let rawPc=null;
let rawStream=null;
let rawRequestId="";
let rawLastAnswerRequestId="";
let rawReconnectTimer=null;
let sourceGeneration=0;
let pendingSyncRequestId="";
let lastHandledSyncResponse="";
let productionSyncTimeout=null;
let lastProductionStateSignature="";
let lastProductionCommandId="";
let lastGlobalStaffSyncRequestId="";
let initialSourceSyncDone=false;
let lastRuntimeReadyKey="";
let staffMediaEnded=false,currentMediaIsLive=null,autoSyncTimer=null,autoSyncBusy=false,staffMuted=false;
const AUTO_SYNC_INTERVAL_MS=60000;
const AUTO_SYNC_TOLERANCE_SECONDS=0.12;
const YOUTUBE_AUTO_SYNC_TOLERANCE_SECONDS=0.35;
const YOUTUBE_AUTO_SYNC_CONFIRM_MS=350;
const PROCESSING_MIN_MS=350;
let processingFeed=false;
let processingStartedAt=0;
let fullscreenUiTimer=null;
let lastProductionPlayerSessionId="";
let pendingObsRefreshResync=false;
let youtubeObsRefreshReloadRequired=false;
let loginSyncPending=false;
let loginSyncGeneration=-1;
let loginSyncPromise=null;
let deterministicSyncPromise=null;
let deterministicSyncQueued=false;
let loginConvergencePending=false;

// FINAL STARTUP/SOURCE-LOAD AUTO-SYNC ATTEMPT:
// Let YouTube genuinely PLAY for 5 continuous seconds first, then perform
// three sequential calls to the exact same routine used by the SYNC button.
let youtubeActivePlayStartedAt=0;
let youtubeStartupMultiSyncGeneration=-1;
let youtubeStartupMultiSyncRunning=false;
let youtubeStartupMultiSyncDone=false;
const YOUTUBE_ACTIVE_PLAY_BEFORE_MULTI_SYNC_MS=5000;
const YOUTUBE_STARTUP_MULTI_SYNC_PRESSES=0;

function resetYoutubeStartupMultiSync(){
  youtubeActivePlayStartedAt=0;
  youtubeStartupMultiSyncGeneration=-1;
  youtubeStartupMultiSyncRunning=false;
  youtubeStartupMultiSyncDone=false;
}

async function runYoutubeStartupMultiSync(gen){
  if(youtubeStartupMultiSyncRunning||youtubeStartupMultiSyncDone)return;
  if(gen!==sourceGeneration||staffMediaEnded||locallyPaused)return;
  if(normalizedType(state&&state.sourceType,state&&state.sourceUrl)!=="youtube")return;

  youtubeStartupMultiSyncRunning=true;
  youtubeStartupMultiSyncGeneration=gen;

  try{
    for(let i=0;i<YOUTUBE_STARTUP_MULTI_SYNC_PRESSES;i++){
      if(gen!==sourceGeneration||staffMediaEnded||locallyPaused)return;
      if(Number(youtubeBridgeState)!==1)return;

      // Exact same synchronization function used by the manual SYNC button.
      await runExactManualSyncFunction("automatic-startup-sync-"+(i+1),i===0);

      if(gen!==sourceGeneration||staffMediaEnded||locallyPaused)return;
      if(i<YOUTUBE_STARTUP_MULTI_SYNC_PRESSES-1){
        await new Promise(r=>setTimeout(r,900));
      }
    }
    if(gen===sourceGeneration)youtubeStartupMultiSyncDone=true;
  }finally{
    youtubeStartupMultiSyncRunning=false;
  }
}

function watchYoutubeActivePlaybackForStartupSync(){
  if(!state ||
     normalizedType(state.sourceType,state.sourceUrl)!=="youtube" ||
     staffMediaEnded ||
     locallyPaused ||
     youtubeStartupMultiSyncDone ||
     youtubeStartupMultiSyncRunning){
    youtubeActivePlayStartedAt=0;
    return;
  }

  // Count ACTIVE PLAYING time only. Buffering, paused, cued, etc. reset the clock.
  if(Number(youtubeBridgeState)!==1){
    youtubeActivePlayStartedAt=0;
    return;
  }

  const now=Date.now();
  if(!youtubeActivePlayStartedAt){
    youtubeActivePlayStartedAt=now;
    return;
  }

  if(now-youtubeActivePlayStartedAt>=YOUTUBE_ACTIVE_PLAY_BEFORE_MULTI_SYNC_MS){
    youtubeActivePlayStartedAt=0;
    runYoutubeStartupMultiSync(sourceGeneration).catch(showError);
  }
}

// DIAGNOSTIC BUILD: automatic startup/resume cleanup disabled.
// setInterval(watchYoutubeActivePlaybackForStartupSync,100);

function beginProcessingFeed(){
  processingFeed=true;
  processingStartedAt=Date.now();
  setCenter("PROCESSING VIDEO FEED",true);

  // Absolute safety valve: a missing/stale OBS sync response must never leave
  // PROCESSING VIDEO FEED stuck over otherwise playable video forever.
  const generationAtStart=sourceGeneration;
  setTimeout(()=>{
    if(processingFeed && generationAtStart===sourceGeneration){
      // iPhone HLS login is intentionally waiting for a REAL user gesture.
      // Do not let the generic 3.5s processing safety valve tear down the exact
      // processing window in which the user's manual SYNC has proven reliable.
      const t=normalizedType(state&&state.sourceType,state&&state.sourceUrl);
      if(IS_IPHONE_WEBKIT && t==="hls" && (loginSyncPending || hlsTapToStartVisible)){
        hlsDiagCommand("iPhone processing hold","3.5s safety valve suppressed while waiting for TAP TO START");
        return;
      }
      processingFeed=false;
      setCenter("",false);
    }
  },3500);
}
async function finishProcessingFeed(){
  setConnection("FIREBASE CONNECTED");
  const wait=Math.max(0,PROCESSING_MIN_MS-(Date.now()-processingStartedAt));
  if(wait)await new Promise(r=>setTimeout(r,wait));
  processingFeed=false;
  setCenter("",false);
}
async function processAndSyncRunningFeed(reason="initial-connect"){
  if(!deviceId||!state)return;
  const type=normalizedType(state.sourceType,state.sourceUrl);

  // OFF / empty production state is authoritative. There is no feed to process.
  if(!type || type==="off"){
    processingFeed=false;
    loginSyncPending=false;
    window.__tjkLoginVeilArm=0;
    if(loginProcessingVeil)loginProcessingVeil.style.display="none";
    hideAllMedia();
    setSourceBadge("");
    setCenter("NO VIDEO FEED LOADED",true);
    return;
  }

  beginProcessingFeed();
  const gen=sourceGeneration, started=Date.now();

  while(Date.now()-started<5000 && gen===sourceGeneration){
    if(type==="nfhs" && rawStream && rawVideo.readyState>=2)break;
    if(type==="youtube" && youtubeReady && youtubeBridgeReady)break;
    if((type==="hls"||type==="mp4") && htmlVideo.readyState>=2)break;
    await new Promise(r=>setTimeout(r,100));
  }
  if(gen!==sourceGeneration)return;

  if(type==="nfhs"){
    if(rawStream){
      try{rawVideo.srcObject=rawStream;await rawVideo.play()}catch(_){}
    }
    await finishProcessingFeed();
    return;
  }

  await deterministicProductionSync(reason,{processing:true});
}

function youtubeStaffMediaActuallyReady(){
  return !!(
    youtubeBridgeReady &&
    youtubeReady &&
    (youtubeBridgeState >= 0 || youtubeBridgeDuration > 0 || youtubeBridgeTime > 0)
  );
}

async function runSettledYoutubeSyncSequence(reason="youtube-single-seek-sync",options={}){
  if(!deviceId||!state||staffMediaEnded)return;
  const gen=sourceGeneration;
  const type=normalizedType(state.sourceType,state.sourceUrl);
  if(type!=="youtube")return deterministicProductionSync(reason,{processing:options.processing!==false});

  const processing=options.processing!==false;
  if(processing && !processingFeed)beginProcessingFeed();

  // DIAGNOSTIC MANUAL SYNC:
  // one fresh OBS measurement -> one target -> one seek -> one play/pause command.
  // No verification, no correction, no second OBS measurement, no convergence.
  const response=await requestProductionSync();
  if(gen!==sourceGeneration||!response)return;
  if(Number(response.sourceRevision)!==Number(state.sourceRevision))return;

  if(response.dvrUnavailable){
    setProcessingStatus("LIVE DELAY UNAVAILABLE");
    await new Promise(r=>setTimeout(r,700));
    if(processingFeed)finishProcessingFeed();
    return;
  }
  if(response.waitingForDelay||response.delayWaiting||response.delayReady===false){
    setProcessingStatus("WAITING FOR PRODUCTION DELAY");
    return;
  }

  const target=compensatedProductionTarget(response,"youtube");

  try{youtubePlayer.seekTo(target,true)}catch(_){}

  if(response.productionPlaying){
    try{youtubePlayer.playVideo()}catch(_){}
    locallyPaused=false;
    setPlayPauseIcon(false);
    playPause.title="Pause";
  }else{
    try{youtubePlayer.pauseVideo()}catch(_){}
    locallyPaused=true;
    setPlayPauseIcon(true);
    playPause.title="Play";
  }

  // UI-only settling delay. Nothing is allowed to seek or resync here.
  await new Promise(r=>setTimeout(r,850));
  if(gen!==sourceGeneration)return;

  if(processingFeed)finishProcessingFeed();
}
async function runLoginBlackScreenSpamSync(){
  if(!loginSyncPending || !deviceId || !state)return;
  const gen=sourceGeneration;
  if(loginSyncPromise && loginSyncGeneration===gen)return loginSyncPromise;

  loginSyncGeneration=gen;
  loginSyncPromise=(async()=>{
    const type=normalizedType(state.sourceType,state.sourceUrl);
    if(type==="nfhs"){
      loginSyncPending=false;
      if(loginProcessingVeil)loginProcessingVeil.style.display="none";
      return;
    }

    const started=Date.now();
    let lastYoutubeLoadRetry=0;
    while(Date.now()-started<5000 && gen===sourceGeneration){
      if(type==="youtube"){
        if(youtubeStaffMediaActuallyReady())break;
        if(Date.now()-lastYoutubeLoadRetry>=700){
          lastYoutubeLoadRetry=Date.now();
          const id=String(state.sourceId||parseYouTubeId(state.sourceUrl)||"").trim();
          if(id)youtubeBridgePost("LOAD",{
            videoId:id,id,sourceId:id,url:String(state.sourceUrl||"")
          });
        }
      }else if((type==="hls"||type==="mp4") && htmlVideo.readyState>=2){
        break;
      }
      await new Promise(r=>setTimeout(r,100));
    }
    if(gen!==sourceGeneration)return;

    if(type==="youtube" && !youtubeStaffMediaActuallyReady()){
      loginSyncPending=false;
      processingFeed=false;
      if(loginProcessingVeil)loginProcessingVeil.style.display="none";
      youtubeHost.classList.remove("hidden");
      setCenter("",false);
      return;
    }

    // Keep the login veil up while YouTube settles, then automatically repeat
    // the same sync transaction that is successful when SYNC is clicked manually.
    if(type==="youtube"){
      // Login has no user gesture. Establish playback muted first so YouTube
      // autoplay policy cannot leave the Staff embed paused, then run the
      // unchanged one-shot synchronization routine.
      try{
        youtubeBridgePost("MUTE");
        youtubeBridgePost("SET_VOLUME",{volume:0});
        if(youtubePlayer)youtubePlayer.playVideo();
      }catch(_){}
      const autoplayStart=Date.now();
      while(Date.now()-autoplayStart<1800 && gen===sourceGeneration){
        if(Number(youtubeBridgeState)===1)break;
        try{if(youtubePlayer)youtubePlayer.playVideo()}catch(_){}
        await new Promise(r=>setTimeout(r,150));
      }
      // Login is the one case where a brand-new YouTube iframe can take
      // several seconds to finish reacting to its first seek. Manual SYNC is
      // already accurate once the iframe is established, so reproduce those
      // successful human corrections here with REAL settling time between them.
      // This loop is login-only and runs before the black login veil is removed.
      await runSettledYoutubeSyncSequence("login",{processing:true});
      if(gen!==sourceGeneration)return;

      // IMPORTANT: do not try to finish YouTube synchronization while the
      // login routine is still active. The proven manual SYNC happens only
      // after login has completely finished and the normal viewer state is
      // restored. Reproduce that exact lifecycle here.
      // Keep the fresh YouTube iframe muted through login. Restoring audible
      // volume here can make browser autoplay policy pause the iframe.

      // V12: do NOT perform another seek while the login lifecycle is still
      // active. Manual SYNC is accurate only after the normal viewer state has
      // been restored, so the final authoritative correction is scheduled
      // after loginSyncPending is cleared and the iframe is revealed.
      loginConvergencePending=false;
    }
    else{
      const wasMuted=htmlVideo.muted;
      locallyPaused=false;
      setPlayPauseIcon(false);
      playPause.title="Pause";

      if(type==="hls" && IS_IPHONE_WEBKIT){
        // iPhone Safari requires a genuine user activation to reliably start
        // this Hudl/hls.js path. Programmatically imitating the SYNC click during
        // login is not equivalent to the real button press and can leave the
        // viewer on a dead black frame. Do not consume the ready source with an
        // automatic play/sync attempt. Surface the same explicit recovery gesture
        // used successfully on iPad, then let startHlsFromFreshUserGesture() start
        // playback synchronously from that tap and immediately run a FRESH normal
        // production sync. No iPad +500 ms compensation is applied to iPhone.
        hlsDiagCommand("iPhone login","ready — waiting for TAP TO START user gesture");
        htmlVideo.muted=wasMuted;
        applyVolume();

        // IMPORTANT — preserve the iPhone login processing window until the
        // user's TAP TO START gesture. Real-world testing showed that the exact
        // manual SYNC routine succeeds reliably while this processing lifecycle
        // is still active, but can fail after login processing is torn down.
        // Do not clear processingFeed or hide the processing veil here.
        // The tap overlay sits above the veil and the tap handler below runs the
        // exact manual-sync transaction before allowing login processing to end.
        processingFeed=true;
        setCenter("PROCESSING VIDEO FEED",true);
        showHlsTapToStart();
      }else if(type==="hls"){
        // iPad/WebKit login sequence: SEEK FIRST, PLAY SECOND.
        // The previous sequence successfully established muted autoplay and then
        // performed a large production seek. Older iPad WebKit paused the media
        // element after that seek even though the buffer remained healthy.
        //
        // Ask OBS for its authoritative position while the element is still
        // paused, seek there, let WebKit settle, and only then start muted
        // autoplay. This avoids disturbing an already-playing MediaSource.
        htmlVideo.muted=true;
        hlsDiagCommand("login seek-first","requesting OBS target before autoplay");

        let loginResponse=null;
        try{loginResponse=await requestProductionSync()}catch(_){}
        if(gen!==sourceGeneration)return;

        if(loginResponse &&
           Number(loginResponse.sourceRevision||0)===Number(state.sourceRevision||0) &&
           !loginResponse.dvrUnavailable &&
           !loginResponse.waitingForDelay &&
           !loginResponse.delayWaiting &&
           loginResponse.delayReady!==false){
          let target=compensatedProductionTarget(loginResponse,"hls");
          try{
            if(htmlVideo.seekable&&htmlVideo.seekable.length){
              const a=Number(htmlVideo.seekable.start(0));
              const b=Number(htmlVideo.seekable.end(htmlVideo.seekable.length-1));
              if(Number.isFinite(a)&&Number.isFinite(b))target=Math.max(a,Math.min(b,target));
            }
            hlsDiagSeek("login seek-before-play",target);
            htmlVideo.currentTime=target;

            // Give old WebKit a short opportunity to complete the MediaSource
            // seek before asking it to begin playback. Do not issue another seek.
            if(htmlVideo.seeking){
              await new Promise(resolve=>{
                let done=false;
                const finish=()=>{
                  if(done)return;
                  done=true;
                  htmlVideo.removeEventListener("seeked",finish);
                  resolve();
                };
                htmlVideo.addEventListener("seeked",finish,{once:true});
                setTimeout(finish,700);
              });
            }
          }catch(_){}

          if(gen!==sourceGeneration)return;
          if(loginResponse.productionPlaying){
            const started=await hlsDiagPlay("login seek-first muted autoplay");
            if(started){
              locallyPaused=false;
              setPlayPauseIcon(false);
              hlsDiagCommand("login seek-first","playback established after production seek");
            }
          }else{
            hlsDiagPause("login seek-first: production paused");
            locallyPaused=true;
            setPlayPauseIcon(true);
          }
        }else{
          // If OBS did not answer, retain the safe muted-autoplay fallback.
          await hlsDiagPlay("login seek-first fallback autoplay");
        }

        if(gen!==sourceGeneration)return;
        htmlVideo.muted=wasMuted;
        applyVolume();
        if(processingFeed)await finishProcessingFeed();
      }else{
        // MP4 keeps the established production behavior.
        try{
          htmlVideo.muted=true;
          await htmlVideo.play();
        }catch(_){}
        await new Promise(r=>setTimeout(r,220));
        await deterministicProductionSync("login",{processing:true});
        if(gen!==sourceGeneration)return;
        htmlVideo.muted=wasMuted;
        applyVolume();
      }
    }
    if(gen!==sourceGeneration)return;

    loginSyncPending=false;

    // Explicitly reveal the successfully prepared media before removing the
    // startup veil.
    if(type==="youtube"){
      youtubeHost.classList.remove("hidden");
      htmlVideo.classList.add("hidden");
      rawVideo.classList.add("hidden");
    }else if(type==="hls"||type==="mp4"){
      htmlVideo.classList.remove("hidden");
      youtubeHost.classList.add("hidden");
      rawVideo.classList.add("hidden");
    }

    if(loginProcessingVeil)loginProcessingVeil.style.display="none";

    // Startup synchronization is now owned exclusively by the
    // five-seconds-of-active-play multi-SYNC watcher.

    // playAndSyncProduction normally clears this through finishProcessingFeed.
    // Clear it here as a final invariant so a completed login can never leave
    // PROCESSING VIDEO FEED stranded over already-playing video.
    processingFeed=false;
    setCenter("",false);
  })().finally(()=>{
    if(loginSyncGeneration===gen){
      loginConvergencePending=false;
      loginSyncPromise=null;
      loginSyncGeneration=-1;
    }
  });

  return loginSyncPromise;
}

function setNestedValue(root,path,data,isPatch){
  const parts=String(path||"/").split("/").filter(Boolean);
  if(!parts.length){
    if(isPatch && root && typeof root==="object" && data && typeof data==="object"){
      Object.assign(root,data);return root;
    }
    return data && typeof data==="object" ? data : {};
  }
  let target=root;
  for(let i=0;i<parts.length-1;i++){
    const k=parts[i];
    if(!target[k]||typeof target[k]!=="object")target[k]={};
    target=target[k];
  }
  const last=parts[parts.length-1];
  if(isPatch && target[last] && typeof target[last]==="object" && data && typeof data==="object"){
    Object.assign(target[last],data);
  }else if(data===null){
    delete target[last];
  }else{
    target[last]=data;
  }
  return root;
}

function normalizedType(v,url){
  const s=String(url||"").trim();
  try{
    const u=new URL(s);
    const host=u.hostname.toLowerCase();
    if(host.includes("youtube.com")||host.includes("youtu.be"))return "youtube";
    const p=u.pathname.toLowerCase();
    if(p.includes(".m3u8"))return "hls";
    if(p.includes(".mp4"))return "mp4";
  }catch(e){}
  v=String(v||"").toLowerCase();
  return ["nfhs","hls","youtube","mp4"].includes(v)?v:"";
}

function parseYouTubeId(input){
  const s=String(input||"").trim();
  if(/^[a-zA-Z0-9_-]{11}$/.test(s))return s;
  try{
    const u=new URL(s);
    if(u.hostname.includes("youtu.be"))return u.pathname.split("/").filter(Boolean)[0]||"";
    if(u.searchParams.get("v"))return u.searchParams.get("v")||"";
    const p=u.pathname.split("/").filter(Boolean);
    const ix=p.findIndex(x=>["embed","live","shorts"].includes(x));
    if(ix>=0&&p[ix+1])return p[ix+1];
  }catch(e){}
  return "";
}

/*
HLS DIAGNOSTICS
Display-only instrumentation for isolating black-screen clients.
It never seeks, plays, pauses, reloads, changes quality, or changes sync state.
Tap the HLS / HUDL badge to show/hide the panel.
*/
let hlsDiagnosticVisible=false;
let hlsDiagnosticLastEvent="none";
let hlsDiagnosticLastError="none";
let hlsDiagnosticPath="none";
let hlsDiagnosticTimer=null;
let hlsDiagnosticLastCommand="none";
let hlsDiagnosticLastPlayResult="none";
let hlsDiagnosticLastSeek="none";
let hlsDiagnosticHlsJsSupport="not tested";
let hlsDiagnosticPauseOrigin="none";
let hlsDiagnosticCommandDepth=0;

function hlsDiagCommand(name,detail=""){
  hlsDiagnosticLastCommand=String(name||"none")+(detail?" | "+String(detail):"");
  renderHlsDiagnostics();
}
function hlsDiagSeek(origin,target){
  hlsDiagnosticLastSeek=String(origin||"unknown")+" -> "+(Number.isFinite(Number(target))?Number(target).toFixed(3):String(target));
  renderHlsDiagnostics();
}
const IS_IPAD_WEBKIT = (()=>{
  const ua=navigator.userAgent||"";
  const platform=navigator.platform||"";
  return /iPad/i.test(ua) || (platform==="MacIntel" && Number(navigator.maxTouchPoints||0)>1);
})();
const IS_IPHONE_WEBKIT = /iPhone|iPod/i.test(navigator.userAgent||"");


let hlsTapToStartVisible=false;
function showHlsTapToStart(){
  if(!(IS_IPAD_WEBKIT||IS_IPHONE_WEBKIT))return;
  if(normalizedType(state&&state.sourceType,state&&state.sourceUrl)!=="hls")return;
  hlsTapToStartVisible=true;
  if(hlsTapToStart)hlsTapToStart.style.display="flex";
  locallyPaused=true;
  setPlayPauseIcon(true);
}
function hideHlsTapToStart(){
  hlsTapToStartVisible=false;
  if(hlsTapToStart)hlsTapToStart.style.display="none";
}
async function startHlsFromFreshUserGesture(){
  if(!hlsTapToStartVisible)return;
  const gen=sourceGeneration;

  if(IS_IPHONE_WEBKIT){
    // iPhone-specific proven sequence:
    // The user's tests show the normal SYNC button is reliable when pressed
    // DURING the login PROCESSING VIDEO FEED window. Therefore do not pre-play,
    // do not wait for currentTime advancement, and do not tear down processing.
    // Use this fresh tap to launch the exact same manual-sync transaction while
    // that login processing state is still alive.
    hlsDiagCommand("iPhone TAP TO START","exact manual SYNC during login processing window");
    locallyPaused=false;
    setPlayPauseIcon(false);
    hideHlsTapToStart();

    try{
      await runExactManualSyncFunction("iphone-tap-manual-sync",true);
    }catch(err){
      if(gen!==sourceGeneration)return;
      hlsDiagCommand("tap required","iPhone manual-equivalent sync threw: "+(err&&err.message?err.message:String(err)));
      showHlsTapToStart();
      return;
    }
    if(gen!==sourceGeneration)return;

    // Only declare login complete after the proven manual-sync path has left us
    // with actual playable media. If Safari is still paused/black, keep the
    // processing lifecycle available and let the user retry the same transaction.
    const usable = !htmlVideo.paused && htmlVideo.readyState>=2 && htmlVideo.videoWidth>0;
    if(!usable){
      processingFeed=true;
      if(loginProcessingVeil)loginProcessingVeil.style.display="block";
      setCenter("PROCESSING VIDEO FEED",true);
      hlsDiagCommand("tap required","iPhone manual-equivalent sync did not establish playable media");
      showHlsTapToStart();
      return;
    }

    processingFeed=false;
    if(loginProcessingVeil)loginProcessingVeil.style.display="none";
    setCenter("",false);
    locallyPaused=false;
    setPlayPauseIcon(false);
    applyVolume();
    return;
  }

  // Preserve the proven iPad lifecycle exactly.
  const started=await hlsDiagPlay("TAP TO START user gesture");
  if(!started)return;
  if(gen!==sourceGeneration)return;

  hideHlsTapToStart();
  locallyPaused=false;
  setPlayPauseIcon(false);
  setCenter("",false);
  applyVolume();

  await new Promise(r=>setTimeout(r,80));
  if(gen!==sourceGeneration||htmlVideo.paused){
    if(htmlVideo.paused)showHlsTapToStart();
    return;
  }

  await deterministicProductionSync("post-user-gesture-fresh-sync",{processing:true});
  if(gen!==sourceGeneration)return;
  if(htmlVideo.paused && !staffMediaEnded){
    hlsDiagCommand("tap required","post-user-gesture sync paused media");
    showHlsTapToStart();
  }
}
if(hlsTapToStartButton)hlsTapToStartButton.addEventListener("click",startHlsFromFreshUserGesture);
if(hlsTapToStart)hlsTapToStart.addEventListener("click",e=>{if(e.target===hlsTapToStart)startHlsFromFreshUserGesture()});

async function hlsDiagPlay(origin){
  hlsDiagnosticCommandDepth++;
  hlsDiagCommand("play()",origin);
  try{
    await htmlVideo.play();
    hlsDiagnosticLastPlayResult="SUCCESS | "+origin;
    return true;
  }catch(err){
    hlsDiagnosticLastPlayResult="REJECTED | "+origin+" | "+(err&&err.name?err.name+": ":"")+(err&&err.message?err.message:String(err));
    if(IS_IPAD_WEBKIT && err&&err.name==="NotAllowedError" && normalizedType(state&&state.sourceType,state&&state.sourceUrl)==="hls"){
      showHlsTapToStart();
    }
    return false;
  }finally{
    hlsDiagnosticCommandDepth=Math.max(0,hlsDiagnosticCommandDepth-1);
    renderHlsDiagnostics();
  }
}
function hlsDiagPause(origin){
  hlsDiagnosticCommandDepth++;
  hlsDiagCommand("pause()",origin);
  try{htmlVideo.pause()}finally{
    setTimeout(()=>{hlsDiagnosticCommandDepth=Math.max(0,hlsDiagnosticCommandDepth-1);renderHlsDiagnostics()},0);
  }
}

function hlsTimeRanges(ranges){
  try{
    const out=[];
    for(let i=0;i<ranges.length;i++){
      out.push(Number(ranges.start(i)).toFixed(2)+"-"+Number(ranges.end(i)).toFixed(2));
    }
    return out.length?out.join(", "):"none";
  }catch(_){return "error"}
}

function hlsReadyStateName(n){
  return ["HAVE_NOTHING","HAVE_METADATA","HAVE_CURRENT_DATA","HAVE_FUTURE_DATA","HAVE_ENOUGH_DATA"][Number(n)]||String(n);
}

function hlsNetworkStateName(n){
  return ["NETWORK_EMPTY","NETWORK_IDLE","NETWORK_LOADING","NETWORK_NO_SOURCE"][Number(n)]||String(n);
}

function renderHlsDiagnostics(){
  if(!hlsDiagnostics || !hlsDiagnosticVisible)return;
  const type=normalizedType(state&&state.sourceType,state&&state.sourceUrl);
  if(type!=="hls"){
    hlsDiagnostics.style.display="none";
    hlsDiagnosticVisible=false;
    return;
  }

  let hlsState="n/a";
  let hlsLevel="n/a";
  let levels="n/a";
  try{
    if(hls){
      hlsState="attached="+!!hls.media;
      hlsLevel=String(hls.currentLevel);
      levels=Array.isArray(hls.levels)?String(hls.levels.length):"0";
    }
  }catch(_){}

  const lines=[
    "HLS DIAGNOSTICS — tap HLS / HUDL badge to close",
    "",
    "Path: "+hlsDiagnosticPath,
    "MediaSource API: "+(window.MediaSource?"YES":"NO"),
    "ManagedMediaSource API: "+(window.ManagedMediaSource?"YES":"NO"),
    "disableRemotePlayback: "+String(!!htmlVideo.disableRemotePlayback),
    "Native HLS canPlayType: "+(htmlVideo.canPlayType("application/vnd.apple.mpegurl")||"NO"),
    "hls.js support: "+hlsDiagnosticHlsJsSupport,
    "Last event: "+hlsDiagnosticLastEvent,
    "Last error: "+hlsDiagnosticLastError,
    "Last command: "+hlsDiagnosticLastCommand,
    "Last play(): "+hlsDiagnosticLastPlayResult,
    "Last seek: "+hlsDiagnosticLastSeek,
    "Last pause origin: "+hlsDiagnosticPauseOrigin,
    "",
    "readyState: "+htmlVideo.readyState+" ("+hlsReadyStateName(htmlVideo.readyState)+")",
    "networkState: "+htmlVideo.networkState+" ("+hlsNetworkStateName(htmlVideo.networkState)+")",
    "paused: "+htmlVideo.paused,
    "ended: "+htmlVideo.ended,
    "currentTime: "+(Number(htmlVideo.currentTime)||0).toFixed(3),
    "duration: "+(Number.isFinite(Number(htmlVideo.duration))?Number(htmlVideo.duration).toFixed(3):String(htmlVideo.duration)),
    "video size: "+htmlVideo.videoWidth+"x"+htmlVideo.videoHeight,
    "buffered: "+hlsTimeRanges(htmlVideo.buffered),
    "seekable: "+hlsTimeRanges(htmlVideo.seekable),
    "",
    "hls.js: "+hlsState,
    "currentLevel: "+hlsLevel,
    "levels: "+levels,
    "media live: "+String(currentMediaIsLive),
    "loginSyncPending: "+loginSyncPending,
    "initialSourceSyncDone: "+initialSourceSyncDone,
    "locallyPaused: "+locallyPaused,
    "",
    "UA: "+navigator.userAgent
  ];
  hlsDiagnostics.textContent=lines.join("\n");
}

function setHlsDiagnosticEvent(name,detail=""){
  hlsDiagnosticLastEvent=String(name||"none")+(detail?" | "+String(detail):"");
  renderHlsDiagnostics();
}

function setHlsDiagnosticError(data){
  if(!data){
    hlsDiagnosticLastError="unknown";
  }else{
    const parts=[
      data.type||"",
      data.details||"",
      data.reason||"",
      data.response&&data.response.code ? "HTTP "+data.response.code : "",
      data.fatal===true ? "fatal" : "nonfatal"
    ].filter(Boolean);
    hlsDiagnosticLastError=parts.join(" | ")||"unknown";
  }
  renderHlsDiagnostics();
}

async function syncOnlyIfOutOfSync(reason="conditional-sync",processing=false){
  if(!deviceId||!state||staffMediaEnded||locallyPaused)return false;
  const gen=sourceGeneration;
  const type=normalizedType(state.sourceType,state.sourceUrl);
  if(!["hls","mp4"].includes(type))return false;

  // Fresh OBS measurement first. If Staff is already aligned, do absolutely
  // nothing: no seek, no play command, no processing overlay.
  const response=await requestProductionSync();
  if(gen!==sourceGeneration||!response)return false;
  if(Number(response.sourceRevision||0)!==Number(state.sourceRevision||0))return false;
  if(response.dvrUnavailable||response.waitingForDelay||response.delayWaiting||response.delayReady===false)return false;

  const target=compensatedProductionTarget(response,type);
  const local=currentStaffPosition(type);
  const tolerance=type==="youtube"?0.35:0.12;
  const outOfSync=!Number.isFinite(local)||Math.abs(local-target)>tolerance;

  if(!outOfSync)return false;

  // Once drift is confirmed, use the exact proven manual-button function.
  await runExactManualSyncFunction(reason,processing);
  return true;
}

function waitIceComplete(peer,timeoutMs=4000){
  if(peer.iceGatheringState==="complete")return Promise.resolve();
  return new Promise(resolve=>{
    let done=false;
    const finish=()=>{
      if(done)return;
      done=true;
      peer.removeEventListener("icegatheringstatechange",check);
      resolve();
    };
    const check=()=>{if(peer.iceGatheringState==="complete")finish()};
    peer.addEventListener("icegatheringstatechange",check);
    setTimeout(finish,timeoutMs);
  });
}

function formatDelaySeconds(seconds){

  if(Math.abs(n-Math.round(n))<0.01)return Math.round(n)+" SECONDS";
  return n.toFixed(1)+" SECONDS";

function getHlsLiveEdge(){
  try{
    if(htmlVideo.seekable&&htmlVideo.seekable.length){
      return Number(htmlVideo.seekable.end(htmlVideo.seekable.length-1));
    }
  }catch(_){}
  try{

    if(d&&Number.isFinite(Number(d.edge)))return Number(d.edge);
  }catch(_){}

function syncHlsToProduction(){
  const edge=getHlsLiveEdge();

  const target=edge-getEffectiveLatency();
  try{

      ? Number(htmlVideo.seekable.start(0))
      : 0;
    htmlVideo.currentTime=Math.max(start,target);

function requestedHeight(){

function chooseHlsCap(levels){
  const maxH=requestedHeight();
  let best=-1,bestScore=-1;
  (levels||[]).forEach((level,index)=>{
    const w=Number(level&&level.width)||0;
    const h=Number(level&&level.height)||0;
    const fps=Number(level&&level.frameRate)||0;
    if(h>maxH || fps>30.5)return;
    const score=(w*h*100000000)+(Number(level&&level.bitrate)||0);
    if(score>bestScore){bestScore=score;best=index}
  });
  return best;
}
function applyHlsQuality(){
  if(!hls || !Array.isArray(hls.levels) || !hls.levels.length)return;
  const cap=chooseHlsCap(hls.levels);

  if(typeof m.time==="number")youtubeBridgeTime=m.time;
  else if(typeof m.currentTime==="number")youtubeBridgeTime=m.currentTime;
  if(typeof m.duration==="number")youtubeBridgeDuration=m.duration;
  if(typeof m.state==="number")youtubeBridgeState=m.state;

  if(m.streamEnded===true){
    markStaffMediaEnded(true,m.endReason||"YouTube bridge stream ended");

  if(m.videoEnded===true){
    markStaffMediaEnded(false,"YouTube bridge VOD ended");

  if(youtubeBridgeState===0 && currentMediaIsLive!==null){
    markStaffMediaEnded(currentMediaIsLive===true,"YouTube bridge ENDED state");
    return;
  }

  const hasBridgeTelemetry=(
    typeof m.playerReady==="boolean" ||
    typeof m.apiReady==="boolean" ||
    typeof m.state==="number" ||
    typeof m.currentTime==="number" ||
    typeof m.duration==="number" ||
    m.type==="READY" || m.event==="READY" || m.type==="STATE" || m.event==="STATE"
  );
  const ready=!!(m.playerReady||m.ready||m.apiReady||m.type==="READY"||m.event==="READY"||
                 (hasBridgeTelemetry && typeof m.state==="number"));
  if(ready&&!youtubeBridgeReady){
    youtubeBridgeReady=true;
    youtubeReady=true;
    applyVolume();
    setMuted(staffMuted);
    applyYouTubeQuality();
    if(productionDelayWaiting())showProductionDelayState();

      if(!loginSyncPending){
        initialSourceSyncDone=true;
        playAndSyncProduction("initial-youtube-sync").catch(showError);

function handleSyncResponse(response){
  if(!response || !response.requestId || response.requestId!==pendingSyncRequestId)return;

  const responsePlayerSessionId=String(response.playerSessionId||"");
  const responseType=normalizedType(state&&state.sourceType,state&&state.sourceUrl);

  if(responseType==="youtube" &&
     responsePlayerSessionId &&
     lastProductionPlayerSessionId &&
     responsePlayerSessionId!==lastProductionPlayerSessionId){
    lockYouTubeAfterObsRefresh(responsePlayerSessionId);

    // Finish the pending request without allowing playAndSyncProduction() to
    // apply this post-refresh position/paused state to Staff.
    lastHandledSyncResponse=response.requestId;
    pendingSyncRequestId="";
    if(productionSyncTimeout){
      clearTimeout(productionSyncTimeout);
      productionSyncTimeout=null;
    }
    if(typeof window.__resolveProductionSync==="function"){
      const fn=window.__resolveProductionSync;
      window.__resolveProductionSync=null;
      fn(null);
    }
    return;
  }

  if(responsePlayerSessionId && !lastProductionPlayerSessionId){
    lastProductionPlayerSessionId=responsePlayerSessionId;
  }

  if(response.requestId===lastHandledSyncResponse)return;

  lastHandledSyncResponse=response.requestId;
  pendingSyncRequestId="";

  if(productionSyncTimeout){
    clearTimeout(productionSyncTimeout);
    productionSyncTimeout=null;
  }

  if(typeof window.__resolveProductionSync==="function"){
    const fn=window.__resolveProductionSync;
    window.__resolveProductionSync=null;
    fn(response);
  }
}

function compensatedProductionTarget(response,type){
  let pos=Math.max(0,Number(response&&response.positionSeconds)||0);
  if(response&&response.productionPlaying&&Number.isFinite(Number(response.respondedAt))){
    const age=Math.max(0,Math.min(2,(Date.now()-Number(response.respondedAt))/1000));
    pos+=age;
    if(type==="youtube"){
      // Calibrated downward again after +0.38s still landed Staff ahead of OBS.
      // Apply this once to the single seek target.
      // No verification/repeated seeks are introduced.
      pos+=0.08;
    }
    if(type==="hls" && IS_IPAD_WEBKIT){
      // iPad/WebKit HLS consistently settles just under one second behind OBS
      // even after the normal fresh-position convergence completes. Apply a
      // small forward calibration ONLY to iPad HLS targets. Desktop HLS keeps
      // the exact production target and is intentionally untouched.
      pos+=0.50;
    }
  }
  return pos;
}

async function applyProductionTarget(response,type){
  let pos=compensatedProductionTarget(response,type);
  if(type==="youtube"){
    if(!youtubeReady)return false;
    try{
      youtubePlayer.seekTo(pos,true);
      if(response.productionPlaying)youtubePlayer.playVideo();
      else youtubePlayer.pauseVideo();
      return true;
    }catch(_){return false}
  }
  try{
    if(htmlVideo.seekable&&htmlVideo.seekable.length){
      const a=Number(htmlVideo.seekable.start(0));
      const b=Number(htmlVideo.seekable.end(htmlVideo.seekable.length-1));
      if(Number.isFinite(a)&&Number.isFinite(b))pos=Math.max(a,Math.min(b,pos));
    }
    if(type==="hls")hlsDiagSeek("applyProductionTarget",pos);
    htmlVideo.currentTime=pos;
    if(response.productionPlaying){
      // iPad/Safari: if the muted login bootstrap already established playback,
      // preserve that autoplay session through the production seek. A redundant
      // play() after the seek can be rejected with NotAllowedError and leave the
      // otherwise healthy HLS element paused. Only request play when it is
      // actually paused.
      if(type==="hls"){
        if(htmlVideo.paused)await hlsDiagPlay("applyProductionTarget: paused recovery");
        else hlsDiagCommand("play preserved","applyProductionTarget: already playing");
      }else await htmlVideo.play().catch(()=>{});
    }else{
      if(type==="hls")hlsDiagPause("applyProductionTarget: production paused");
      else htmlVideo.pause();
    }
    return true;
  }catch(_){return false}
}

async function waitForHlsSeekSettle(gen,timeoutMs=900){
  if(gen!==sourceGeneration)return false;
  if(!htmlVideo.seeking)return true;
  return new Promise(resolve=>{
    let done=false;
    const finish=v=>{if(done)return;done=true;clearTimeout(timer);htmlVideo.removeEventListener("seeked",onSeeked);resolve(v)};
    const onSeeked=()=>finish(gen===sourceGeneration);
    const timer=setTimeout(()=>finish(gen===sourceGeneration),timeoutMs);
    htmlVideo.addEventListener("seeked",onSeeked,{once:true});
  });
}

async function runHlsChaseSync(reason,options={}){
  if(staffMediaEnded||!deviceId||!state)return;
  const processing=options.processing!==false;
  const gen=sourceGeneration;

  if(processing && !processingFeed)beginProcessingFeed();
  locallyPaused=false;
  setPlayPauseIcon(false);
  playPause.title="Pause";

  // iPad-only convergence. Desktop HLS never enters this routine.
  // Each correction waits for WebKit to FINISH the seek before asking OBS for
  // another authoritative position, so a slow seek cannot make the next target stale.
  for(let pass=0;pass<4;pass++){
    const response=await requestProductionSync();
    if(gen!==sourceGeneration)return;
    if(!response||Number(response.sourceRevision||0)!==Number(state.sourceRevision||0)){
      if(processing)setCenter("Could not get sync feedback from OBS. Press SYNC to retry.",true);
      processingFeed=false;
      return;
    }
    if(response.delayWaiting||response.delayReady===false){
      setCenter(staffWaitingMessage(Number(response.delaySeconds)||getEffectiveLatency()),true);
      processingFeed=false;
      return;
    }
    if(!response.productionPlaying){
      hlsDiagPause("iPad sync: production paused");
      processingFeed=false;
      setCenter("SYNCED TO OBS — PRODUCTION IS PAUSED",true);
      return;
    }

    let target=compensatedProductionTarget(response,"hls");
    try{
      if(htmlVideo.seekable&&htmlVideo.seekable.length){
        const a=Number(htmlVideo.seekable.start(0));
        const b=Number(htmlVideo.seekable.end(htmlVideo.seekable.length-1));
        if(Number.isFinite(a)&&Number.isFinite(b))target=Math.max(a,Math.min(b,target));
      }
    }catch(_){}

    const local=Number(htmlVideo.currentTime);
    const delta=Number.isFinite(local)?target-local:Infinity;
    hlsDiagCommand("iPad sync pass "+(pass+1),"delta="+(Number.isFinite(delta)?delta.toFixed(3):"n/a"));

    // Once we're within 90 ms on a fresh OBS measurement, stop touching playback.
    if(pass>0 && Number.isFinite(delta) && Math.abs(delta)<=0.09)break;

    hlsDiagSeek("iPad sync pass "+(pass+1),target);
    try{htmlVideo.currentTime=target}catch(_){}
    await waitForHlsSeekSettle(gen,900);
    if(gen!==sourceGeneration)return;

    // Let currentTime advance after seeked before judging the next fresh sample.
    await new Promise(r=>setTimeout(r,90));
    if(gen!==sourceGeneration)return;

    if(htmlVideo.paused){
      processingFeed=false;
      hlsDiagCommand("tap required","iPad sync paused after pass "+(pass+1));
      showHlsTapToStart();
      return;
    }
  }

  if(processingFeed)await finishProcessingFeed();
  else if(processing)setCenter("",false);
}

async function runDeterministicProductionSync(reason,options={}){
  if(staffMediaEnded||!deviceId||!state)return;
  const type=normalizedType(state.sourceType,state.sourceUrl);
  const processing=options.processing!==false;
  const gen=sourceGeneration;

  if(processing && !processingFeed)beginProcessingFeed();
  locallyPaused=false; setPlayPauseIcon(false); playPause.title="Pause";

  if(type==="nfhs"){
    if(!rawStream)await startRawViewerConnection();
    else try{rawVideo.srcObject=rawStream;await rawVideo.play()}catch(_){}
    if(processingFeed)await finishProcessingFeed();
    return;
  }

  if(!["hls","youtube","mp4"].includes(type))return;

  const first=await requestProductionSync();
  if(gen!==sourceGeneration)return;
  if(!first||Number(first.sourceRevision||0)!==Number(state.sourceRevision||0)){
    if(processing)setCenter("Could not get sync feedback from OBS. Press SYNC to retry.",true);
    processingFeed=false;
    return;
  }
  if(first.dvrUnavailable&&first.delaySupported!==false){setCenter("YOUTUBE DVR IS NOT AVAILABLE FOR THIS LIVE STREAM",true);processingFeed=false;return;}
  if(first.delayWaiting||first.delayReady===false){
    setCenter(staffWaitingMessage(Number(first.delaySeconds)||getEffectiveLatency()),true);
    try{htmlVideo.pause()}catch(_){}; try{if(youtubeReady&&youtubePlayer)youtubePlayer.pauseVideo()}catch(_){}
    processingFeed=false; return;
  }

  await applyProductionTarget(first,type);
  if(gen!==sourceGeneration)return;

  // Let the seek/play command actually land, then ask OBS again. The second
  // response is fresh; we do not recursively call another convergence routine.
  await new Promise(r=>setTimeout(r,type==="youtube"?500:250));
  if(gen!==sourceGeneration)return;
  const verify=await requestProductionSync();
  if(gen!==sourceGeneration)return;

  if(verify&&Number(verify.sourceRevision||0)===Number(state.sourceRevision||0)){
    const target=compensatedProductionTarget(verify,type);
    const local=currentStaffPosition(type);
    const tolerance=type==="youtube"?0.35:0.12;
    if(!Number.isFinite(local)||Math.abs(local-target)>tolerance){
      await applyProductionTarget(verify,type);
    }else{
      // Position is already good. Only mirror a changed play/pause state.
      try{
        if(type==="youtube"){
          if(verify.productionPlaying)youtubePlayer.playVideo(); else youtubePlayer.pauseVideo();
        }else if(verify.productionPlaying){
          if(type==="hls"){
            if(htmlVideo.paused)await hlsDiagPlay("verify production state: paused recovery");
            else hlsDiagCommand("play preserved","verify production state: already playing");
          }else await htmlVideo.play().catch(()=>{});
        }else htmlVideo.pause();
      }catch(_){}
    }
    if(!verify.productionPlaying){processingFeed=false;setCenter("SYNCED TO OBS — PRODUCTION IS PAUSED",true);return;}
  }

  if(processingFeed)await finishProcessingFeed(); else if(processing)setCenter("",false);

  // Older iPadOS can silently pause HLS after a large MediaSource seek even when
  // the source is healthy and buffered. Surface the user-gesture recovery instead
  // of leaving Staff on a frozen frame with no explanation.
  if((IS_IPAD_WEBKIT||IS_IPHONE_WEBKIT) && type==="hls" && !staffMediaEnded && htmlVideo.paused){
    hlsDiagCommand("tap required","sync completed with HLS paused");
    showHlsTapToStart();
  }
}

async function deterministicProductionSync(reason="staff",options={}){
  const syncType=normalizedType(state&&state.sourceType,state&&state.sourceUrl);
  if(syncType==="hls" && IS_IPAD_WEBKIT)return runHlsChaseSync(reason,options);

  // Never allow login, admin, manual, and 60-second sync transactions to
  // overwrite one another's request IDs. One transaction owns the channel.
  if(deterministicSyncPromise){
    deterministicSyncQueued=true;
    await deterministicSyncPromise.catch(()=>{});
    if(deterministicSyncQueued){
      deterministicSyncQueued=false;
      return deterministicProductionSync(reason,options);
    }
    return;
  }
  deterministicSyncPromise=runDeterministicProductionSync(reason,options);
  try{await deterministicSyncPromise}finally{deterministicSyncPromise=null}
}

async function playAndSyncProduction(reason="staff"){
  const automatic=reason==="automatic-60-second-sync";
  return deterministicProductionSync(reason,{processing:!automatic});
}

async function buildHls(s,generation){
  hideAllMedia();
  htmlVideo.classList.remove("hidden");
  setCenter("Loading HLS / Hudl feed…",true);

  const url=String(s.sourceUrl||"").trim();
  if(!url)throw new Error("No HLS URL.");

  hlsDiagnosticLastEvent="buildHls:start";
  hlsDiagnosticLastError="none";
  hlsDiagnosticLastCommand="none";
  hlsDiagnosticLastPlayResult="none";
  hlsDiagnosticLastSeek="none";
  hlsDiagnosticPauseOrigin="none";
  hlsDiagnosticHlsJsSupport="not tested";
  hlsDiagnosticPath="selecting…";
  renderHlsDiagnostics();

  // iPhone Safari can expose an hls.js-supported ManagedMediaSource path even
  // when the legacy window.MediaSource probe is false. Load hls.js first on
  // iPhone and let Hls.isSupported() be authoritative. disableRemotePlayback
  // on the video element allows WebKit ManagedMediaSource to activate.
  let iphoneHlsJsSupported=false;
  if(IS_IPHONE_WEBKIT){
    try{
      htmlVideo.disableRemotePlayback=true;
      await ensureHlsJs();
      iphoneHlsJsSupported=!!(window.Hls&&typeof Hls.isSupported==="function"&&Hls.isSupported());
      hlsDiagnosticHlsJsSupport=String(iphoneHlsJsSupported);
    }catch(err){
      hlsDiagnosticHlsJsSupport="library load failed: "+(err&&err.message?err.message:String(err));
    }
  }

  if(window.MediaSource || iphoneHlsJsSupported){
    hlsDiagnosticPath=IS_IPHONE_WEBKIT && !window.MediaSource ? "hls.js / iPhone managed media" : "hls.js / MediaSource";
    setHlsDiagnosticEvent("path-selected",hlsDiagnosticPath);
    if(!window.Hls) await ensureHlsJs();
    hlsDiagnosticHlsJsSupport=(window.Hls&&typeof Hls.isSupported==="function")?String(Hls.isSupported()):"Hls loaded; isSupported unavailable";
    renderHlsDiagnostics();
    if(generation!==sourceGeneration)return;

    hls=new Hls({
      enableWorker:true,
      lowLatencyMode:false,
      liveSyncDuration:getEffectiveLatency(),
      liveMaxLatencyDuration:getEffectiveLatency()+60,
      maxLiveSyncPlaybackRate:1.0,
      backBufferLength:60,
      maxBufferLength:30,
      maxMaxBufferLength:60,
      maxBufferHole:0.5,
      highBufferWatchdogPeriod:3,
      startLevel:-1,
      testBandwidth:true,
      capLevelToPlayerSize:true
    });

    ["MANIFEST_LOADING","MANIFEST_LOADED","LEVEL_LOADING","LEVEL_LOADED","FRAG_LOADING","FRAG_LOADED","BUFFER_CREATED","BUFFER_APPENDED"].forEach(eventName=>{
      const ev=Hls.Events[eventName];
      if(!ev)return;
      hls.on(ev,(event,data)=>{
        let detail="";
        if(data&&data.frag)detail="sn="+String(data.frag.sn)+" level="+String(data.frag.level);
        else if(data&&data.level!==undefined)detail="level="+String(data.level);
        setHlsDiagnosticEvent("hls:"+eventName,detail);
      });
    });

    hls.on(Hls.Events.MEDIA_ATTACHED,()=>{
      setHlsDiagnosticEvent("hls:MEDIA_ATTACHED");
      hls.loadSource(url);
    });
    hls.on(Hls.Events.MANIFEST_PARSED,(event,data)=>{
      if(generation!==sourceGeneration)return;
      setHlsDiagnosticEvent("hls:MANIFEST_PARSED","levels="+((data&&data.levels&&data.levels.length)||0));
      applyHlsQuality();
      if(productionDelayWaiting()){
        showProductionDelayState();
      }
    });
    hls.on(Hls.Events.LEVEL_UPDATED,(event,data)=>{
      setHlsDiagnosticEvent("hls:LEVEL_UPDATED");
      applyHlsQuality();
      const d=data&&data.details;
      if(d){
        if(typeof d.live==="boolean")currentMediaIsLive=d.live;
        else if(d.endList===true)currentMediaIsLive=false;
      }
    });
    hls.on(Hls.Events.FRAG_BUFFERED,(event,data)=>{
      if(generation!==sourceGeneration)return;
      setHlsDiagnosticEvent("hls:FRAG_BUFFERED",
        data&&data.frag ? "sn="+String(data.frag.sn)+" level="+String(data.frag.level) : "");
      if(htmlVideo.readyState>=2){
        if(!loginSyncPending && !initialSourceSyncDone && !locallyPaused && productionDelayReady()){
          initialSourceSyncDone=true;
          // OBS is authoritative. Once its protected delay gate is ready,
          // ask for the exact media position it is rendering.
          playAndSyncProduction("initial-hls-sync").catch(showError);
        }else if(productionDelayWaiting()){
          showProductionDelayState();
        }else{
          setCenter("",false);
        }
      }
    });
    hls.on(Hls.Events.ERROR,(event,data)=>{
      setHlsDiagnosticError(data);
      setHlsDiagnosticEvent("hls:ERROR",
        (data&&data.type?data.type:"")+" "+(data&&data.details?data.details:""));
      if(!data||!data.fatal)return;
      if(data.type===Hls.ErrorTypes.NETWORK_ERROR){
        if(currentMediaIsLive===true && htmlVideo.currentTime>0){
          showStaffEndedBlack(true);
          return;
        }
        try{hls.startLoad()}catch(_){}
      }else if(data.type===Hls.ErrorTypes.MEDIA_ERROR){
        try{hls.recoverMediaError()}catch(_){}
      }else{
        setCenter("HLS feed could not be played in this browser.",true);
      }
    });

    hls.attachMedia(htmlVideo);
    return;
  }

  if(htmlVideo.canPlayType("application/vnd.apple.mpegurl")){
    hlsDiagnosticPath="native HLS";
    setHlsDiagnosticEvent("path-selected","native HLS");
    // Diagnostic-only capability probe. Loading the hls.js library does NOT attach
    // it to the media element and does not alter the native-HLS playback path.
    ensureHlsJs().then(()=>{
      hlsDiagnosticHlsJsSupport=(window.Hls&&typeof Hls.isSupported==="function")?String(Hls.isSupported()):"Hls loaded; isSupported unavailable";
      renderHlsDiagnostics();
    }).catch(err=>{
      hlsDiagnosticHlsJsSupport="library load failed: "+(err&&err.message?err.message:String(err));
      renderHlsDiagnostics();
    });
    htmlVideo.src=url;
    htmlVideo.addEventListener("loadedmetadata",()=>{
      if(generation!==sourceGeneration)return;
      if(!loginSyncPending && !initialSourceSyncDone && !locallyPaused && productionDelayReady()){
        initialSourceSyncDone=true;
        playAndSyncProduction("initial-hls-sync").catch(showError);
      }else if(productionDelayWaiting()){
        showProductionDelayState();
      }else{
        if(!locallyPaused&&state&&state.playing)hlsDiagPlay("native loadedmetadata autoplay").catch(()=>{});
        setCenter("",false);
      }
    },{once:true});
    htmlVideo.load();
    return;
  }

  throw new Error("HLS playback is not supported by this browser.");
}

htmlVideo.addEventListener("ended",()=>{
  const t=normalizedType(state&&state.sourceType,state&&state.sourceUrl);
  if(t==="mp4")markStaffMediaEnded(false,"MP4 ended");
  else if(t==="hls")markStaffMediaEnded(currentMediaIsLive===true,"HLS ended");
});

async function buildMp4(s,generation){
  currentMediaIsLive=false;
  hideAllMedia();
  htmlVideo.classList.remove("hidden");
  setCenter("Loading MP4 feed…",true);
  htmlVideo.src=String(s.sourceUrl||"").trim();
  htmlVideo.addEventListener("loadeddata",async()=>{
    if(generation!==sourceGeneration)return;
    if(!locallyPaused){
      const response=await requestProductionSync();
      if(response && Number(response.sourceRevision||0)===Number(state.sourceRevision||0)){
        try{htmlVideo.currentTime=Math.max(0,Number(response.positionSeconds)||0)}catch(_){}
        if(response.productionPlaying)htmlVideo.play().catch(()=>{});
      }else if(state&&state.playing){
        htmlVideo.play().catch(()=>{});
      }
    }
    setCenter("",false);
  },{once:true});
  htmlVideo.load();
}

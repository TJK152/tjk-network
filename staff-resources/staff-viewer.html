async function buildYouTube(s,generation){
  hideAllMedia();
  youtubeHost.classList.remove("hidden");
  setCenter("Loading YouTube feed…",true);

  const id=String(s.sourceId||parseYouTubeId(s.sourceUrl)||"").trim();
  if(!id)throw new Error("Invalid YouTube URL.");

  youtubeHost.innerHTML="";
  youtubeBridgeReady=false;
  youtubeReady=false;
  youtubeBridgeState=-1;
  youtubeBridgeDuration=0;
  youtubeBridgeTime=0;
  currentMediaIsLive=null;

  const frame=document.createElement("iframe");
  frame.src=YOUTUBE_BRIDGE_URL+"?tjk_staff=1&_="+Date.now();
  frame.allow="autoplay; encrypted-media; picture-in-picture";
  frame.tabIndex=-1;
  frame.setAttribute("aria-hidden","true");
  frame.referrerPolicy="strict-origin-when-cross-origin";
  frame.style.cssText="position:absolute;inset:0;width:100%;height:100%;border:0;background:#000;";
  youtubeHost.appendChild(frame);
  youtubeBridgeFrame=frame;
  youtubePlayer=makeYoutubeBridgeAdapter();

  frame.addEventListener("load",()=>{
    if(generation!==sourceGeneration)return;
    // Production bridge accepts LOAD over postMessage.
    youtubeBridgePost("LOAD",{videoId:id,id,sourceId:id,url:String(s.sourceUrl||"")});
    // Repeat briefly to cover bridge initialization without Firebase polling.
    setTimeout(()=>{if(generation===sourceGeneration)youtubeBridgePost("LOAD",{videoId:id,id,sourceId:id,url:String(s.sourceUrl||"")})},350);
    setTimeout(()=>{if(generation===sourceGeneration)youtubeBridgePost("LOAD",{videoId:id,id,sourceId:id,url:String(s.sourceUrl||"")})},900);
    setTimeout(()=>{if(generation===sourceGeneration&&!youtubeStaffMediaActuallyReady())youtubeBridgePost("LOAD",{videoId:id,id,sourceId:id,url:String(s.sourceUrl||"")})},1600);
    setTimeout(()=>{
      if(generation!==sourceGeneration||staffMediaEnded||locallyPaused||loginSyncPending)return;
      // Explicit login/source-load synchronization owns YouTube positioning.
      // This timer may mark readiness, but it must never perform another seek.
      if(youtubeBridgeReady || youtubeBridgeDuration>0 || youtubeBridgeState>=0){
        youtubeReady=true;
        applyVolume();
      }
    },1400);
  });
}


async function startRawViewerConnection(){
  if(!deviceId||!state)return;

  closeRawPeer();
  hideAllMedia();
  rawVideo.classList.remove("hidden");
  setCenter(normalizedType(state&&state.sourceType,state&&state.sourceUrl)==="youtube"?"Connecting to YouTube WebRTC…":"Connecting to Browser Capture…",true);
  setConnection("CONNECTING");

  const generation=sourceGeneration;

  rawPc=new RTCPeerConnection({iceServers:[
    {urls:"stun:stun.l.google.com:19302"},
    {urls:"stun:stun1.l.google.com:19302"}
  ]});

  rawPc.addTransceiver("video",{direction:"recvonly"});
  rawPc.addTransceiver("audio",{direction:"recvonly"});

  rawPc.ontrack=event=>{
    if(generation!==sourceGeneration)return;

    if(event.streams&&event.streams[0]){
      rawStream=event.streams[0];
    }else{
      if(!rawStream)rawStream=new MediaStream();
      rawStream.addTrack(event.track);
    }

    if(!locallyPaused){
      youtubeHost.classList.add("hidden");
      htmlVideo.classList.add("hidden");
      rawVideo.classList.remove("hidden");
      rawVideo.srcObject=rawStream;
      applyVolume();
      rawVideo.play().catch(()=>{});
      if(event.track && event.track.kind==="video"){
        processingFeed=false;
        if(loginProcessingVeil)loginProcessingVeil.style.display="none";
        setCenter("",false);
      }
    }
  };

  rawPc.onconnectionstatechange=()=>{
    if(!rawPc||generation!==sourceGeneration)return;
    const st=rawPc.connectionState;
    setConnection("WEBRTC "+st.toUpperCase());

    if(st==="connected"){
      setCenter("",false);
      if(["nfhs","youtube"].includes(normalizedType(state&&state.sourceType,state&&state.sourceUrl))){
        // Reassert the live selection after the peer is established. This is an
        // in-place sender command and does NOT reconnect RTC.
        publishWebRtcQualityControl().catch(console.warn);
      }
    }else if(st==="failed"||st==="disconnected"){
      setCenter("Browser Capture connection interrupted — reconnecting…",true);
      if(!rawReconnectTimer){
        rawReconnectTimer=setTimeout(()=>{
          rawReconnectTimer=null;
          if(state&&["nfhs","youtube"].includes(normalizedType(state.sourceType,state.sourceUrl))){
            startRawViewerConnection().catch(showError);
          }
        },1500);
      }
    }
  };

  const offer=await rawPc.createOffer();
  await rawPc.setLocalDescription(offer);
  await waitIceComplete(rawPc);

  if(generation!==sourceGeneration||!rawPc)return;

  rawRequestId="raw-"+Date.now()+"-"+Math.random().toString(36).slice(2,8);
  rawLastAnswerRequestId="";

  await fbPut(clientPath("request"),{
    requestId:rawRequestId,
    createdAt:Date.now(),
    quality:quality.value||"auto",
    offer:rawPc.localDescription
  });

  processFirebaseSnapshot();
}

async function applyRawAnswer(answer){
  if(
    !rawPc ||
    !answer ||
    !answer.description ||
    answer.requestId!==rawRequestId ||
    answer.requestId===rawLastAnswerRequestId ||
    rawPc.remoteDescription
  )return;

  rawLastAnswerRequestId=answer.requestId;
  await rawPc.setRemoteDescription(answer.description);
}

async function buildSource(s){
  setConnection("FIREBASE CONNECTED");
  destroySource();
  resetYoutubeStartupMultiSync();
  initialSourceSyncDone=false;
  lastRuntimeReadyKey="";
  state=s;

  const type=normalizedType(s&&s.sourceType,s&&s.sourceUrl);
  setSourceBadge(type);

  // OFF / empty source is authoritative. Never process a black video frame.
  if(!type || type==="off"){
    processingFeed=false;
    loginSyncPending=false;
    window.__tjkLoginVeilArm=0;
    if(loginProcessingVeil)loginProcessingVeil.style.display="none";
    currentSourceKey=sourceKeyOf(s);
    hideAllMedia();
    setSourceBadge("");
    setCenter("NO VIDEO FEED LOADED",true);
    return;
  }

  // YouTube and NFHS are already live WebRTC feeds. They do not need the
  // legacy PROCESSING VIDEO FEED / timeline synchronization path.
  if(type!=="youtube" && type!=="nfhs")beginProcessingFeed();
  else{
    processingFeed=false;
    if(loginProcessingVeil)loginProcessingVeil.style.display="none";
  }
  currentSourceKey=sourceKeyOf(s);
  lastProductionStateSignature=JSON.stringify([
    s&&s.playing,
    s&&s.commandId||"",
    s&&s.command||"",
    s&&s.sourceRevision||0,
    s&&s.targetLatencySeconds
  ]);
  const generation=sourceGeneration;

  if(!type){
    setCenter("Waiting for production to load a video source…",true);
    return;
  }

  try{
    if(type==="nfhs"){
      await startRawViewerConnection();
    }else if(type==="hls"){
      await buildHls(s,generation);
    }else if(type==="youtube"){
      await startRawViewerConnection();
      initialSourceSyncDone=true;
    }else if(type==="mp4"){
      await buildMp4(s,generation);
    }

    // A fresh Staff login must not merely load the media element and wait.
    // Autoplay the active feed, then synchronize it to OBS before revealing it.
    if(loginSyncPending && generation===sourceGeneration){
      runLoginBlackScreenSpamSync().catch(showError);
    }

  }catch(err){
    showError(err);
  }
}

async function handleState(next){
  const runtime=firebaseView&&firebaseView.runtime;
  const playerSessionId=String(runtime&&runtime.playerSessionId||"");
  if(playerSessionId){
    if(lastProductionPlayerSessionId &&
       playerSessionId!==lastProductionPlayerSessionId && state){

      const refreshType=normalizedType(state.sourceType,state.sourceUrl);

      if(refreshType==="youtube"){
        // YouTube only: OBS Browser Source refresh recovery is intentionally manual.
        // Stop and hide Staff immediately. The user must reload/re-login, which uses
        // the known-good black-screen login + repeated baseline SYNC sequence.
        lockYouTubeAfterObsRefresh(playerSessionId);
      }else{
        // HLS / MP4 / Browser Capture: preserve the original working baseline
        // automatic refresh/re-sync behavior exactly.
        pendingObsRefreshResync=true;
        beginProcessingFeed();
      }
    }

    lastProductionPlayerSessionId=playerSessionId;

    if(!youtubeObsRefreshReloadRequired &&
       pendingObsRefreshResync &&
       runtime.delayReady===true &&
       runtime.delayWaiting!==true){
      pendingObsRefreshResync=false;
      setTimeout(()=>processAndSyncRunningFeed("obs-player-refresh").catch(()=>{}),250);
    }
  }

  if(youtubeObsRefreshReloadRequired){
    hideAllMedia();
    if(loginProcessingVeil)loginProcessingVeil.style.display="block";
    setCenter("OBS VIDEO FEED WAS REFRESHED - PLEASE RELOAD OR PRESS PLAY / SYNC",true);
    return;
  }

  if(!next||typeof next!=="object")return;

  const oldKey=currentSourceKey;
  state=next;
  const nextKey=sourceKeyOf(next);

  if(nextKey!==oldKey){
    locallyPaused=false;
    setPlayPauseIcon(false);
    lastProductionCommandId=String(next.commandId||"");
    await buildSource(next);
    return;
  }

  /*
  Firebase also pushes staff signaling nodes. Do not re-run production
  transport logic merely because a staff answer/syncResponse changed.
  */
  const stateSignature=JSON.stringify([
    next.playing,
    next.commandId||"",
    next.command||"",
    next.sourceRevision||0,
    next.targetLatencySeconds
  ]);
  if(stateSignature===lastProductionStateSignature)return;
  lastProductionStateSignature=stateSignature;

  const type=normalizedType(next.sourceType,next.sourceUrl);
  if(staffMediaEnded)return;
  const command=String(next.command||"").toLowerCase();
  const commandId=String(next.commandId||"");
  const isNewCommand=!!commandId && commandId!==lastProductionCommandId;
  if(isNewCommand)lastProductionCommandId=commandId;

  /*
  A production GO LIVE is authoritative: OBS performs its normal seek first,
  then this viewer asks OBS for the position it actually landed on. The main
  control-panel SYNC is handled separately as a staff-only sync event.
  */
  if(isNewCommand && command==="golive"){
    locallyPaused=false;
    setPlayPauseIcon(false);
    playPause.title="Pause";
    // Do not race the control panel's post-OBS synchronization. Production
    // moves first; the later global staff request starts PROCESSING VIDEO FEED
    // and performs the authoritative multi-pass convergence.
    return;
  }

  if(!next.playing){
    // OBS applies Pause first. Then request its exact stopped frame and copy
    // that position/state to Staff so every viewer remains on the same frame.
    if(isNewCommand && command==="pause"){
      // Pause locally immediately, but leave exact-frame convergence to the
      // control panel's settled global sync so we do not run two syncs at once.
      try{
        if(type==="youtube"&&youtubeReady)youtubePlayer.pauseVideo();
        else if(type==="nfhs")rawVideo.pause();
        else htmlVideo.pause();
      }catch(_){}
      locallyPaused=false;
      setPlayPauseIcon(true);
      playPause.title="Play and sync to production";
      return;
    }
    try{
      if(type==="youtube"&&youtubeReady)youtubePlayer.pauseVideo();
      else if(type==="nfhs")rawVideo.pause();
      else htmlVideo.pause();
    }catch(_){}
    return;
  }

  // A staff-local pause remains local until staff presses Play/SYNC, unless
  // production issued the authoritative SYNC/GO LIVE handled above.
  if(locallyPaused)return;

  if(isNewCommand && command==="play"){
    // Start following playback immediately; exact position convergence is
    // intentionally deferred to the settled global staff sync from controls.
    try{
      if(type==="youtube"&&youtubeReady)youtubePlayer.playVideo();
      else if(type==="nfhs")rawVideo.play().catch(()=>{});
      else htmlVideo.play().catch(()=>{});
    }catch(_){}
    return;
  }

  try{
    if(type==="youtube"&&youtubeReady)youtubePlayer.playVideo();
    else if(type==="nfhs")rawVideo.play().catch(()=>{});
    else htmlVideo.play().catch(()=>{});
  }catch(_){}
}

function processFirebaseSnapshot(){
  if(youtubeObsRefreshReloadRequired){
    hideAllMedia();
    if(loginProcessingVeil)loginProcessingVeil.style.display="block";
    setCenter("OBS VIDEO FEED WAS REFRESHED - PLEASE RELOAD OR PRESS PLAY / SYNC",true);
    return;
  }
  const next=firebaseView&&firebaseView.state;
  if(next&&typeof next==="object"){
    handleState(next).catch(showError);
  }

  const own=
    firebaseView &&
    firebaseView.staff &&
    firebaseView.staff.clients &&
    firebaseView.staff.clients[clientId];

  if(own&&own.answer){
    applyRawAnswer(own.answer).catch(showError);
  }

  if(own&&own.syncResponse){
    handleSyncResponse(own.syncResponse);
  }

  const runtime=currentRuntime();
  if(runtime){
    const runtimeKey=String(runtime.sourceRevision||0)+"|"+String(runtime.delayReady)+"|"+String(runtime.delayWaiting)+"|"+String(runtime.dvrUnavailable)+"|"+String(runtime.streamEnded)+"|"+String(runtime.videoEnded);
    if(runtimeKey!==lastRuntimeReadyKey){
      lastRuntimeReadyKey=runtimeKey;
      // OBS production is authoritative about HLS live-vs-VOD termination.
      // This also covers cases where the Staff browser itself only goes black
      // and never receives a reliable HTMLMediaElement ended event.
      if(runtime.streamEnded===true){
        markStaffMediaEnded(true,"Production HLS runtime reported stream ended");
      }else if(runtime.videoEnded===true){
        markStaffMediaEnded(false,"Production runtime reported video ended");
      }else if(runtime.dvrUnavailable && runtime.delaySupported!==false){
        showProductionDelayState();
      }else if(runtime.delayWaiting){
        showProductionDelayState();
      }else if(runtime.delayReady){
        const type=normalizedType(state&&state.sourceType,state&&state.sourceUrl);
        if((type==="hls"||type==="youtube") && !locallyPaused && !loginSyncPending){
          initialSourceSyncDone=true;
          playAndSyncProduction("runtime-delay-ready").catch(showError);
        }
      }
    }
  }

  const globalStaffSync=
    firebaseView &&
    firebaseView.staff &&
    firebaseView.staff.syncRequest;

  if(
    globalStaffSync &&
    globalStaffSync.requestId &&
    globalStaffSync.requestId!==lastGlobalStaffSyncRequestId
  ){
    lastGlobalStaffSyncRequestId=globalStaffSync.requestId;

    /*
    Main control-panel SYNC is staff-only. It never changes OBS.
    Each viewer independently asks OBS for its current position and follows it.
    */
    // Admin/global synchronization deliberately uses the visible processing path.
    // This mirrors the more reliable login behavior: process, converge, then reveal.
    processAndSyncRunningFeed("control-panel-staff-sync").catch(showError);
  }
}

async function openFirebaseStream(){
  closeFirebaseStream();
  firebaseView={};
  tjkFirebaseStreamHealthy=false;
  try{await tjkSelectFirebaseServer()}
  catch(err){setConnection("FIREBASE UNAVAILABLE");startFirebaseFallbackPolling();return}

  firebaseStream=new EventSource(streamPath());

  const handle=(ev,isPatch)=>{
    try{
      const msg=JSON.parse(ev.data||"{}");
      firebaseView=setNestedValue(firebaseView,msg.path,msg.data,isPatch);
      processFirebaseSnapshot();
    }catch(err){
      console.warn("Firebase event:",err);
    }
  };

  firebaseStream.addEventListener("put",ev=>handle(ev,false));
  firebaseStream.addEventListener("patch",ev=>handle(ev,true));

  firebaseStream.onopen=()=>{
    tjkFirebaseStreamHealthy=true;
    stopFirebaseFallbackPolling();
    setConnection(FIREBASE_BASE===FIREBASE_BACKUP?"FIREBASE CONNECTED — BACKUP":"FIREBASE CONNECTED");
  };
  firebaseStream.onerror=()=>{
    tjkFirebaseStreamHealthy=false;
    startFirebaseFallbackPolling();
    if(!rawPc||rawPc.connectionState!=="connected")setConnection("FIREBASE RECONNECTING");
  };
}
function stopFirebaseFallbackPolling(){
  if(tjkFirebaseFallbackTimer){clearInterval(tjkFirebaseFallbackTimer);tjkFirebaseFallbackTimer=null}
}
function startFirebaseFallbackPolling(){
  if(tjkFirebaseFallbackTimer||!deviceId)return;
  const poll=async()=>{
    if(tjkFirebaseStreamHealthy){stopFirebaseFallbackPolling();return}
    try{
      const data=await fbGet(streamPath());
      if(data&&typeof data==="object"){firebaseView=data;await processFirebaseSnapshot()}
    }catch(_){}
  };
  poll();
  tjkFirebaseFallbackTimer=setInterval(poll,TJK_FIREBASE_FALLBACK_POLL_MS);
}

function closeFirebaseStream(){
  if(firebaseStream){
    try{firebaseStream.close()}catch(_){}
    firebaseStream=null;
  }
}

function showError(err){
  console.error(err);
  setCenter((err&&err.message)||String(err)||"Playback error.",true);
  setConnection("ERROR");
}

async function connectToDevice(){
  const next=cleanDeviceId(deviceInput.value);
  if(!next){
    modalStatus.textContent="Enter a Device ID.";
    return;
  }

  modalStatus.textContent="Connecting…";

  if(deviceId&&clientId){
    try{await fbDelete(clientPath("request"))}catch(_){}
    try{await fbDelete(clientPath("answer"))}catch(_){}
    try{await fbDelete(clientPath("syncRequest"))}catch(_){}
    try{await fbDelete(clientPath("syncResponse"))}catch(_){}
  }

  destroySource();
  closeFirebaseStream();

  deviceId=next;
  loginSyncPending=true;
  if(loginProcessingVeil)loginProcessingVeil.style.display="block";
  const loginVeilArm=Date.now();
  window.__tjkLoginVeilArm=loginVeilArm;
  setTimeout(()=>{
    if(window.__tjkLoginVeilArm!==loginVeilArm || !loginSyncPending)return;
    const t=normalizedType(state&&state.sourceType,state&&state.sourceUrl);

    // iPhone HLS may legitimately still be waiting for TAP TO START at 4.5s.
    // Previously this generic login timeout silently destroyed processingFeed,
    // which explains why the same tap/manual-sync sequence worked only when it
    // happened early enough. Keep the login transaction alive until the user
    // actually performs the required gesture.
    if(IS_IPHONE_WEBKIT && t==="hls" && hlsTapToStartVisible){
      hlsDiagCommand("iPhone login hold","4.5s login timeout suppressed while waiting for TAP TO START");
      processingFeed=true;
      setCenter("PROCESSING VIDEO FEED",true);
      return;
    }

    loginSyncPending=false;
    processingFeed=false;
    if(loginProcessingVeil)loginProcessingVeil.style.display="none";
    if(!t || t==="off"){
      hideAllMedia();
      setSourceBadge("");
      setCenter("NO VIDEO FEED LOADED",true);
      return;
    }
    if(t==="youtube"||t==="nfhs")rawVideo.classList.remove("hidden");
    else if(t==="hls"||t==="mp4")htmlVideo.classList.remove("hidden");
    setCenter("",false);
  },4500);
  processingFeed=false;
  setCenter("",false);
  try{sessionStorage.setItem(DEVICE_TAB_SESSION_KEY,deviceId)}catch(_){}
  try{localStorage.removeItem(DEVICE_STORAGE_KEY)}catch(_){}
  clientId=makeClientId();
  currentSourceKey="";
  state=null;

  openFirebaseStream();
  deviceModal.style.display="none";
  modalStatus.textContent="";
  setCenter("Connected to Device ID.\nWaiting for the production video source…",true);
}

async function publishWebRtcQualityControl(){
  if(!deviceId||!clientId)return;
  await fbPut(clientPath("qualityControl"),{
    id:"quality-"+Date.now()+"-"+Math.random().toString(36).slice(2,7),
    quality:quality.value||"auto",
    createdAt:Date.now()
  });
}
async function publishNfhsQualityControl(){return publishWebRtcQualityControl()}

async function changeQuality(){
  localStorage.setItem(QUALITY_STORAGE_KEY,quality.value);

  const type=normalizedType(state&&state.sourceType,state&&state.sourceUrl);

  if(type==="nfhs" || type==="youtube"){
    // Both WebRTC senders change quality in-place. Never rebuild the Staff peer
    // merely for a quality change, which keeps Production isolated.
    await publishWebRtcQualityControl();
    setCenter("",false);
  }
  // HLS/MP4 have fixed source quality; the selector is disabled and stays Auto.
}

function toggleMute(){
  setMuted(!isMuted());
}

async function toggleFullscreen(){
  const target=document.getElementById("viewer")||document.documentElement;

  // iPhone Safari does not provide reliable document/element fullscreen for
  // arbitrary page containers.  For an active Staff video, use Safari's native
  // video fullscreen API instead of opening a duplicate viewer tab.
  if(IS_IPHONE_WEBKIT){
    const type=normalizedType(state&&state.sourceType,state&&state.sourceUrl);
    if(["hls","mp4","nfhs","youtube"].includes(type)){
      const video=(type==="nfhs"||type==="youtube")?rawVideo:htmlVideo;
      try{
        if(video && typeof video.webkitEnterFullscreen==="function"){
          video.webkitEnterFullscreen();
          return;
        }
        if(video && typeof video.webkitEnterFullScreen==="function"){
          video.webkitEnterFullScreen();
          return;
        }
      }catch(err){
        console.warn("iPhone native video fullscreen failed:",err);
      }
      setCenter("FULLSCREEN IS NOT AVAILABLE IN THIS iPHONE BROWSER",true);
      setTimeout(()=>{if(state)setCenter("",false)},1200);
      return;
    }
  }

  try{
    const active=document.fullscreenElement||document.webkitFullscreenElement;
    if(active){
      if(document.exitFullscreen)await document.exitFullscreen();
      else if(document.webkitExitFullscreen)document.webkitExitFullscreen();
      return;
    }
    if(target.requestFullscreen){
      await target.requestFullscreen();
      revealFullscreenUi();
      return;
    }
    if(target.webkitRequestFullscreen){
      target.webkitRequestFullscreen();
      revealFullscreenUi();
      return;
    }
  }catch(err){
    console.warn("Wix iframe blocked fullscreen:",err);
  }

  // Parent Wix iframe permissions cannot be overridden from inside this page.
  // Open a standalone copy carrying the already-authenticated Device ID so the
  // fullscreen tab does NOT ask the staff member to log in again.
  try{
    const u=new URL(window.location.href);
    const activeDevice=cleanDeviceId(deviceId||sessionStorage.getItem(DEVICE_TAB_SESSION_KEY)||"");
    if(activeDevice){
      u.searchParams.set("device",activeDevice);
      u.searchParams.set("standalone","1");
    }
    const w=window.open(u.toString(),"_blank");
    if(!w)setCenter("FULLSCREEN BLOCKED BY WIX / BROWSER\nAllow pop-ups or open the Staff Viewer directly.",true);
  }catch(err){
    console.warn("Standalone viewer fallback:",err);
  }
}

function showDeviceDialog(){
  deviceInput.value=deviceId||sessionStorage.getItem(DEVICE_TAB_SESSION_KEY)||"";
  deviceModal.style.display="flex";
  setTimeout(()=>deviceInput.focus(),0);
}

rawVideo.addEventListener("play",()=>{
  const t=normalizedType(state&&state.sourceType,state&&state.sourceUrl);
  if(t==="youtube"||t==="nfhs"){locallyPaused=false;setPlayPauseIcon(false);}
});
rawVideo.addEventListener("pause",()=>{
  const t=normalizedType(state&&state.sourceType,state&&state.sourceUrl);
  if((t==="youtube"||t==="nfhs")&&!staffMediaEnded){locallyPaused=true;setPlayPauseIcon(true);}
});
htmlVideo.addEventListener("play",()=>{
  const t=normalizedType(state&&state.sourceType,state&&state.sourceUrl);
  if(t==="hls"){hideHlsTapToStart();}
  if(t==="hls"||t==="mp4"){locallyPaused=false;setPlayPauseIcon(false);}
});
htmlVideo.addEventListener("pause",()=>{
  const t=normalizedType(state&&state.sourceType,state&&state.sourceUrl);
  if((t==="hls"||t==="mp4")&&!staffMediaEnded){locallyPaused=true;setPlayPauseIcon(true);}
});

playPause.onclick=async()=>{
  if(youtubeObsRefreshReloadRequired){
    try{await recoverYouTubeRefreshManually()}catch(err){showError(err)}
    return;
  }
  if(locallyPaused){
    const type=normalizedType(state&&state.sourceType,state&&state.sourceUrl);
    locallyPaused=false;
    if(type==="youtube"||type==="nfhs"){
      locallyPaused=false;
      if(rawStream)rawVideo.srcObject=rawStream;
      applyVolume();
      rawVideo.play().catch(showError);
      setCenter("",false);
    }else{
      if(type==="hls"){
        // This call happens directly inside the user's tap/click, preserving the
        // browser user-activation needed by iPadOS. Once playback is established,
        // the normal production sync only seeks the already-playing element.
        const started=await hlsDiagPlay("user gesture resume");
        if(!started){
          locallyPaused=true;
          setPlayPauseIcon(true);
          setCenter("PRESS PLAY TO RESUME THE VIDEO FEED",true);
          return;
        }
        locallyPaused=false;
        setPlayPauseIcon(false);
        setCenter("",false);

        // PLAY is itself a fresh user gesture. Start playback first, then obtain
        // a NEW OBS position and synchronize the already-playing HLS element.
        // Do not use a position measured before the user started playback.
        const gen=sourceGeneration;
        await new Promise(r=>setTimeout(r,80));
        if(gen!==sourceGeneration)return;
        await deterministicProductionSync("play-button-post-gesture-fresh-sync",{processing:true});
        if(gen!==sourceGeneration)return;
        if(IS_IPAD_WEBKIT && htmlVideo.paused && !staffMediaEnded){
          hlsDiagCommand("tap required","play-button sync paused media");
          showHlsTapToStart();
        }
        return;
      }
      playAndSyncProduction("resume").catch(showError);
    }
  }else pauseLocal();
};
syncButton.onclick=()=>{
  if(normalizedType(state&&state.sourceType,state&&state.sourceUrl)==="youtube"){
    setCenter("YouTube is already on the shared WebRTC timeline.",true);
    setTimeout(()=>setCenter("",false),700);
    return;
  }
  if(youtubeObsRefreshReloadRequired){
    recoverYouTubeRefreshManually().catch(showError);
    return;
  }
  if(!staffMediaEnded){
    runExactManualSyncFunction("manual-sync",true).catch(showError);
  }
};
muteButton.onclick=toggleMute;
volume.oninput=applyVolume;
quality.onchange=()=>changeQuality().catch(showError);
fullscreen.onclick=toggleFullscreen;
changeDevice.onclick=showDeviceDialog;
connectButton.onclick=()=>connectToDevice().catch(showError);
deviceInput.addEventListener("keydown",e=>{
  if(e.key==="Enter")connectToDevice().catch(showError);
});
["mousemove","pointermove","pointerdown","keydown"].forEach(ev=>{
  document.addEventListener(ev,revealFullscreenUi,{passive:true});
});
document.addEventListener("fullscreenchange",()=>{
  fullscreen.textContent="⛶";
  fullscreen.title=document.fullscreenElement?"Exit Full Screen":"Full Screen";
  if(document.fullscreenElement)revealFullscreenUi();
  else{
    document.body.classList.remove("fullscreen-idle");
    if(fullscreenUiTimer)clearTimeout(fullscreenUiTimer);
  }
});

window.addEventListener("beforeunload",()=>{
  if(autoSyncTimer)clearInterval(autoSyncTimer);
  closeFirebaseStream();
  destroySource();

  if(deviceId&&clientId){
    for(const suffix of ["request","answer","syncRequest","syncResponse"]){
      fetch(clientPath(suffix),{
        method:"DELETE",
        keepalive:true,
        cache:"no-store"
      }).catch(()=>{});
    }
  }
});

(function init(){
  clientId=makeClientId();

  // NFHS V11.2: every fresh Staff Viewer page starts in Auto.
  // A prior manual choice must never silently become the next session's default.
  quality.value="auto";
  try{localStorage.setItem(QUALITY_STORAGE_KEY,"auto")}catch(_){}

  // Every page load starts Staff audio at full volume and unmuted.
  // Do not restore a stale muted/0% state from an earlier tab or refresh.
  volume.value="100";
  staffMuted=false;
  htmlVideo.muted=false;
  rawVideo.muted=false;
  try{localStorage.removeItem(VOLUME_STORAGE_KEY)}catch(_){}

  applyVolume();
  setMuted(false);
  startAutoSyncTimer();

  // Login belongs to this tab session only: refresh keeps it; a new tab asks again.
  const savedDevice=cleanDeviceId(sessionStorage.getItem(DEVICE_TAB_SESSION_KEY)||"");
  let handoffDevice="";
  let standaloneHandoff=false;
  try{
    const q=new URLSearchParams(window.location.search||"");
    standaloneHandoff=q.get("standalone")==="1";
    handoffDevice=cleanDeviceId(q.get("device")||"");
  }catch(_){}

  // The fullscreen fallback is an intentional authenticated handoff.
  if(standaloneHandoff && handoffDevice){
    try{sessionStorage.setItem(DEVICE_TAB_SESSION_KEY,handoffDevice)}catch(_){}
    deviceInput.value=handoffDevice;
    deviceModal.style.display="none";
    setTimeout(()=>connectToDevice().catch(showError),150);
    return;
  }

  if(savedDevice){
    deviceInput.value=savedDevice;
    deviceModal.style.display="none";
    setTimeout(()=>connectToDevice().catch(showError),150);
  }else{
    deviceInput.value="";
    showDeviceDialog();
  }
})();

["loadedmetadata","durationchange","playing"].forEach(ev=>{
  htmlVideo.addEventListener(ev,()=>forceHtmlCaptionsOff(htmlVideo));
  rawVideo.addEventListener(ev,()=>forceHtmlCaptionsOff(rawVideo));
});
setInterval(()=>{
  forceHtmlCaptionsOff(htmlVideo);
  forceHtmlCaptionsOff(rawVideo);
  try{if(youtubeReady&&youtubePlayer)youtubeBridgePost("CAPTIONS_OFF")}catch(_){}
},500);
